<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'">
    <link rel="stylesheet" href="./dist/tileset-browser.css">
    <title>RPG Toolkit editor</title>
  </head>
  <body>
    <main>
      <h1>RPG Toolkit editor</h1>
      <p>Open a project folder for direct writes, or open one game as a session copy. Use the Files panel to open other project documents.</p>
      <button id="open-project" type="button">Open project folder</button>
      <label for="open-session">Open .gam session copy</label>
      <input id="open-session" type="file" accept=".gam">
      <label id="recent-project-label" for="recent-project" hidden>Recent project</label>
      <select id="recent-project" hidden></select>
      <button id="reopen-project" type="button" hidden>Reopen project</button>
      <label id="project-game-label" for="project-game" hidden>Game in project</label>
      <select id="project-game" hidden></select>
      <button id="open-selected-game" type="button" hidden>Open selected game</button>
      <div id="document-actions" role="toolbar" aria-label="Document" hidden>
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <button id="save-as" type="button">Save as…</button>
        <button id="save-all" type="button">Save all</button>
        <button id="revert" type="button">Revert</button>
        <button id="close" type="button">Close</button>
      </div>
      <p id="host-status" role="status" aria-live="polite">No document open.</p>
      <section id="settings" aria-label="Editor workbench"></section>
    </main>
    <script src="./dist/editor-web.js"></script>
  </body>
</html>
