<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- ADR 0029: a standalone page that hosts Monaco allows inline styles and its own font; scripts stay strict, with no eval and no blob: workers (a classic same-origin worker is `worker-src 'self'`). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; connect-src 'self'; frame-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self'">
    <link rel="icon" href="./dist/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="./dist/tkr-32.png">
    <link rel="stylesheet" href="./dist/tileset-browser.css">
    <link rel="stylesheet" href="./dist/program-view.css">
    <link rel="stylesheet" href="./dist/editor-web.css">
    <title>RPG Toolkit editor</title>
  </head>
  <body class="tkr-web-body">
    <main class="tkr-web-shell">
      <header class="tkr-web-topbar">
        <div class="tkr-web-brand">
          <img class="tkr-web-brand-icon" src="./dist/tkr-32.png" alt="" width="20" height="20">
          <h1>RPG Toolkit editor</h1>
        </div>
        <div id="document-actions" class="tkr-web-doc-actions" role="toolbar" aria-label="Document" hidden>
          <button id="mirror-view" type="button" aria-pressed="false">Second view</button>
          <button id="undo" type="button">Undo</button>
          <button id="redo" type="button">Redo</button>
          <button id="save-as" type="button">Save as…</button>
          <button id="save-all" type="button">Save all</button>
          <button id="revert" type="button">Revert</button>
          <button id="close" type="button">Close</button>
        </div>
        <p id="host-status" class="tkr-web-status" role="status" aria-live="polite">No document open.</p>
      </header>
      <div class="tkr-web-workspace">
        <aside class="tkr-web-project-bar" aria-label="Project explorer">
          <div class="tkr-web-empty-explorer-header">
            <span class="tkr-web-empty-explorer-title">Explorer</span>
            <span class="tkr-web-empty-explorer-section">▾ No Game Opened</span>
            <p class="tkr-web-subtitle">Looks like you don't have a game open yet. Open a project folder for direct writes and package publication, create a new project in a folder you choose, or open one game as a session copy.</p>
          </div>
          <div class="tkr-web-project-controls">
            <button id="open-project" type="button" class="tkr-web-primary-open">Open project folder</button>
            <button id="new-project" type="button">New project…</button>
            <div class="tkr-web-session-open">
              <label for="open-session">Open .gam session copy</label>
              <input id="open-session" type="file" accept=".gam">
            </div>
            <div class="tkr-web-recent-open">
              <label id="recent-project-label" for="recent-project" hidden>Recent project</label>
              <select id="recent-project" hidden></select>
              <button id="reopen-project" type="button" hidden>Reopen project</button>
            </div>
            <div class="tkr-web-game-choice">
              <label id="project-game-label" for="project-game" hidden>Game in project</label>
              <select id="project-game" hidden></select>
              <button id="open-selected-game" type="button" hidden>Open selected game</button>
            </div>
          </div>
        </aside>
        <section id="settings" aria-label="Editor workbench"></section>
        <section id="mirror" aria-label="Second document view" hidden></section>
      </div>
    </main>
    <script src="./dist/editor-web.js"></script>
  </body>
</html>
