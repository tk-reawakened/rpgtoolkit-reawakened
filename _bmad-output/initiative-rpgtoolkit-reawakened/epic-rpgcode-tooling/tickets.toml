[[entry]]
id = 4
tracker_id = "#941"
type = "story"
title = "RPGCode index: symbols, includes, call sites and event listeners as one versioned JSON schema"
description = "Builds the ONE symbol and reference index that the LSP, the linter and the CLI all read (no second index beside it): per program, definitions from `Program.functions`/`classes`/`labels` with a qualified name and the spelling as written, the include graph from `ProgramRef.includes`/`Program.fileKeys` and the AST's `IncludeRequest`s (explicit versus implicit), call and reference sites from the `call { name, argc, file? }` and `load`/`declRef`/`storeRef`/`member`/`methodCall`/`construct` ops at their `SourcePos`, class members and methods from `CompiledClass`, event listeners from the literal first argument of `on`/`once`/`emit` call sites, and package start-up entry points from the start-up refs — all emitted as one versioned JSON document plus a library API in `script-tools`, with a located diagnostic instead of invented facts for a program that does not compile, and no CodeGraph, tree-sitter or Node dependency. This is the SEMANTIC surface: Epic 22's upstream CodeGraph extractor builds a syntactic node/edge graph from the tree-sitter CST and is blind to resolved includes, `file.func` binding, arity and literal call arguments, so neither artefact replaces the other (proposal section 12.2)."
verify = "On the sample corpus the index lists every function, class, label and include with its file and line and every call site with its callee name and arity; a `file.func` call resolved through an include appears under the including program with the include edge; a class's methods and members appear under the class; an `on(\"error\", …)` site names its event; a program with a syntax error yields a located diagnostic and no fabricated facts; the document validates against the versioned schema and is byte-stable across two runs."
covers = ["CAP-14"]
after = [3]
hitl = false
risk = "medium"
references = [
  "code - packages/core/src/script/program.ts:99-115 (Program: functions, classes, labels, files, fileKeys, notices)",
  "code - packages/core/src/script/ops.ts:43-140 (StepOp: call { name, argc, file?, pos }, load, declRef, storeRef, member, methodCall, construct)",
  "code - packages/core/src/script/lower.ts:42-50 (CompiledClass: bases, members, methods, constructor, destructor)",
  "code - packages/core/src/script/ast.ts:243-259 (IncludeRequest, Ast.includes)",
  "code - packages/runner-harness/src/package-catalogue.ts (package start-up refs and catalogue entries)",
  "why - discovery/inception-proposal.md section 12 (the CodeGraph angle, the syntactic-versus-semantic division, and why the Python code-graph-rag tool is not an integration path)",
]

