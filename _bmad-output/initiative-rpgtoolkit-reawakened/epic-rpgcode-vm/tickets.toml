[[entry]]
id = 25
tracker_id = "#358"
type = "story"
title = "Plugin manifest and the engine's default manifest"
description = "Defines the plugin manifest as plain data (ADR 0004 decision 6): an ordered list of entries `{ id, enabled?, options? }` that selects and orders the `PluginDefinition`s entry 3's assembly function layers, with the engine's own default manifest listing the built-in `core` pack (pinned: it can be wrapped but not removed or disabled) and growing as optional packs land. A game or user manifest is a patch over the default (add, remove, disable, reorder or replace by id; replacing everything is removing every default id). The host resolves each `id` to a loadable definition and hands the resolved list to core; core loads nothing (G2), and an unresolvable id is a located diagnostic, not a crash. `options` is passed to the plugin and read by the VM for the request timeout default (entry 9). The engine's own wiring reads the default through this same path, with no private route. It is distinct from the distribution package's `manifest.json` (`docs/spec/formats/packaging-and-paths.md`)."
verify = "The default manifest assembles to the same registry the engine uses, a user manifest that removes, disables, reorders, replaces and appends entries produces the documented chain, removing or disabling `core` is refused with a diagnostic, an unresolvable id yields a located diagnostic and the rest still load, and `core` imports no module loader or file API."
