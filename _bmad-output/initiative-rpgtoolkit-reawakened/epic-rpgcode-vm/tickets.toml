# tickets.toml — planned entries of epic-rpgcode-vm, in build order. tickets.py reads it.
# Decisions (Jensen, 2026-10-11): TK2 and TK3 games both play at launch; RPGCode v1 is a nice to have; PluginDefinition starts with commands only and every command responds and records its effects through it; per-entry doc-first rulings for the semantic rows; the breakpoint hook, pause state and createEngine are epic 4's. See discovery/inception-proposal.md.

[[entry]]
id = 1
tracker_id = "#353"
type = "story"
title = "RPGCode §9 doc amendments and dialect rulings"
description = "Applies the discovery's 12 `docs/spec/engine/rpgcode-language.md` doc-fix proposals and the TK2 RPGCode gaps (the `< >` inline-block form is TK 1.x only while 2.x uses `{ }`; `#x! = 1` assignment lines; labels with #Branch and #FBranch; #Method and #ReturnMethod; includes and namespace includes; the `=`-as-comparison set; #For and one-line blocks; `<var>` interpolation), ratifies the 14 corpus-settled rows, rules the lexical, expression, statement, function and program rows (LEX, EXP, STX, FUN, PRG) the grammar needs, and settles the 9.11 ownership gaps, in one docs-only commit (G7). The semantic rows (OOP, ERR, THR, SEM, MOD) are ruled by a doc-first step inside the entry that implements them. Also records the shapes the community survey found missing from section 9: inline trailing `*` comments, `#` before any statement, `#if(cond)` without spaces, `!=` and `=` as equality, `#RPGCode` as runtime eval, `<var>` splicing in message text, `#redirect(#a,#b.c)` and the `system.*` namespace."
verify = "The commit touches only `docs/` and a person reads and approves it; every LEX, EXP, STX, FUN and PRG rule entries 5 to 17 rely on is stated in the amended section 9 or named as deferred with the entry it affects."
covers = ["CAP-5"]
after = []
hitl = true
risk = "medium"
