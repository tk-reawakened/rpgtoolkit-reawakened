[[entry]]
id = 3
tracker_id = "#357"
type = "story"
title = "PluginDefinition (commands only) and the built-in registry assembly"
description = "Defines `PluginDefinition` as `{ id, version, commands }` (ADR 0004 decisions 2 and 6), where a command is an AD-8 `BuiltinSpec` with a functional contract: `(read-only view, args, next) -> { out, effects, wait? }`, `next` being the definition of the same name in the layer below (command middleware, so a name is a stack of layers); commands never mutate state and the VM and owning modules apply their effects (amends AD-8 and AD-10 doc-first, including its duplicate rule). A result may also carry an AD-9 `wait`, or an AD-17 `request` with a `then` continuation (AD-8's `resume`, a named command plus plain-data args) (ADR 0004 decision 7; the VM side is entry 9). Adds a pure assembly function over an ordered list of `PluginDefinition`s (the manifest that selects and orders them is entry 25): the later layer runs first with `next` reaching the one below, the first definition's layer being the built-in `core` pack, and a warning diagnostic for a repeated name or alias (replacing AD-8's duplicate rejection, which stays only as a lint for one plugin repeating itself), by-reference `out` write-back sharing the call and lvalue machinery entry 2 built, and the four-tier lookup skeleton (redirect, script function, built-in, empty extension tier). Replaces the tracer's provisional registry. Other fields (`subsystems`, `decoders`, a dialect hook) are added by the entry that first needs them; not `createEngine`, which epic 4 owns (D12). The override warning goes through the AD-24 `Logger` port, which this entry defines minimally (levels and plain-data records) and entry 7 extends: a warn record with code `command.overridden` and data { name, kind (plugin or script), previous, replacement }."
verify = "The assembly function lets the later of two `PluginDefinition`s run first for a repeated name or alias, emits one warning diagnostic naming both, and a wrapper fixture that calls `next` and one that ignores it both behave as documented, a fixture command that returns a `request` with a `then` continuation is accepted by the contract, a fixture command's `out` writes the caller's variable back, a command run twice on the same view and args returns equal results and leaves the view unchanged, stub tiers resolve in the documented order, and ADR 0004, AD-8 and AD-10 state the functional contract. and one `command.overridden` warn record per replaced name reaches the `Logger` port"
covers = ["CAP-5"]
after = [2]
hitl = true
risk = "medium"
references = [
  "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-8 (assembly, duplicate rejection, precedence), AD-10 (vm section ownership)",
  "adr - docs/adr/0004-script-ast-step-ir-and-plugins.md, decisions 2, 6 and 7 (dogfooded standard library, one contract and manifest, async at the boundary)",
  "reference - `docs/spec/engine/rpgcode-functions.md`",
