# tickets.toml — planned entries of epic-rpgcode-platform, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is an owner-approval docs checkpoint (pending); entry 2 is an early owner-read spike.
# Lanes: A objects (3, 4, 5, then 13), B packages (6, 7, 8, then 16), C main-file list (9), D events (10, 11, 12). 10 owns the events section; 15 reconciles shared barrels, the phase list and the GameState section list. 16 owns the package catalogue seam in boot and the engine's package start-up run.
# Builds what Epic 18 recorded as not built: the object runtime, receiver binding and registerPlugin.

[[entry]]
id = 1
tracker_id = "#451"
type = "story"
title = "Rulings: objects, receivers, packages, emitters and the trust baseline"
description = "Doc-first (G7), docs only: settles in docs/spec the dictionary/object runtime and receiver rules (OOP-10, OOP-11, `bindThis`), RPGCode packages on the single shared plugin manifest (name, version, namespace, declared host requests, AD-8 later-wins), `registerPlugin` as a thin layer over the 18.5 environment table, emitter semantics including cancelable emits, the plugin-language guidance and the trust baseline ADR, a host-provided (hydrated) method mechanism so a built-in object type such as an actor or a Media voice carries data only and no closures in a save, and amends AD-32 to the queued (asynchronous) event-bus model with an explicit G1 check (parked plain-JSON dispatch, saveable mid-dispatch, deterministic registration order), rewrites the E-99 Reawakened rule (RPGCode packages are trusted because the VM contains them; ADR 0008 states this), writes the initiative principle \"3.1 is a compatibility layer, not the model\" into docs/adr/0009-compatibility-layer-not-the-model.md (consistent with ADR 0005) and the CLAUDE.md working notes, and rules `kill()` (deletes only storage the script owns; system-controlled names, `tk*` constants, engine virtual variables and actor stat aliases, are a catchable runtime error with code `kill.system-owned`, ERR-2 gains that row; `kill(obj.field)` removes the key) and the virtual-variable write rule (write through where writable, otherwise a catchable runtime error `assign.read-only`, also an ERR-2 row; the 3.1 broken-link quirk is not reproduced) in the `kill` row of docs/spec rpgcode-functions.md and rpgcode-language.md, rules the game-emitter `error` event (type `error`, detail `{ code, message, file, line, handled }`, non-cancelable, fired in addition to ERR-2 handling whether or not a handler caught the error), and confirms the emitter names `on`, `off`, `once`, `emit`, `emitCancelable`."
verify = "The commit touches only docs and affected spec/ADR/spine text; every ruling row carries an OWNER marker, evidence and a rejected alternative; the 2026-10-19 owner decisions each map to one ruled row; the `kill.system-owned` and `assign.read-only` rows exist in ERR-2's failure table, the `error` event shape is ruled, and the `kill` and virtual-variable write rules are written in docs/spec (rpgcode-language.md, rpgcode-functions.md) with evidence and the rejected alternative (3.1's broken link); ADR 0009 (compatibility layer, not the model) exists and CLAUDE.md working notes carry the principle; ADR 0008 (trust baseline) exists and states that RPGCode packages are trusted (VM-contained) with no trust gating; the AD-32 line is amended to the queued model and the G1 check (parked plain-JSON dispatch, saveable mid-dispatch, deterministic registration order) is written; E-99 is rewritten; no later entry relies on unruled behaviour; a person approves the checkpoint."
covers = ["CAP-5", "CAP-11"]
after = ["18.7", "3.23", "3.25"]
hitl = true
