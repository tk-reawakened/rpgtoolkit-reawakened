[[entry]]
id = 4
tracker_id = "#454"
type = "story"
title = "Receiver auto-binding, this and bindThis"
description = "Builds the `OP_GET_MEMBER_BOUND` opcode named in ADR 0004 decision 8 (member access that auto-binds the receiver, on `.` and `->`): reading a callable member binds `CallableValue.receiver` to the object, tear-offs keep it, standalone lambdas have `this = null`, and the built-in `bindThis(fn, obj)` returns a rebound callable; `this` resolves from the receiver."
