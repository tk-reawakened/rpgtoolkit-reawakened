type = "story"
title = "Masters: tick-scheduled frames and offline WAV"
description = "Record lossless masters: PNG frames captured every n ticks, and a WAV rendered offline from synth in step with the same ticks."
verify = "1. Frames are captured on a tick schedule (every n ticks) into a numbered PNG folder; never on wall-clock time.\n2. Audio is rendered offline by synth and written as WAV, with sample positions derived from ticks by the documented integer rule.\n3. A manifest of the recording is written next to the masters.\n4. Replaying the manifest reproduces every frame and the WAV byte for byte.\n5. core unchanged; goldens unchanged."
