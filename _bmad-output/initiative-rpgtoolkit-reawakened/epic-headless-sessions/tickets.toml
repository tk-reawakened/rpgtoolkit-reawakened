[[entry]]
id = 1
tracker_id = "#719"
type = "story"
title = "Write the session protocol, manifest and capture reference"
description = "Write the reference in docs/ before any code (G7): the session manifest, start modes, typed fixtures and the RPGCode built-ins each compiles to, mock responders, capture options, the tick-to-sample rule, and the JSON-RPC methods and events."
verify = "1. A docs page defines the manifest schema (game, seed, start, fixtures, mocks, inputs, capture) and the resolved-manifest output, with a worked example.\n2. Each typed fixture names the documented docs/spec built-ins it compiles to; any fixture without a documented route is listed as out of scope, not guessed.\n3. Each mock lists its options per request kind (asset, loadBlob, saveBlob, listBlobs, playVideo, extension.call, quit, openUrl).\n4. Capture options define screenshot, masters (PNG frames, WAV) and MP4, including the exact integer rule that maps ticks to audio sample positions.\n5. Every option and method has help text: a plain explanation first, then units, ticks, order and whether it waits.\n6. States the FFmpeg rule: MP4 export needs an FFmpeg the user installs; we never bundle, link or ship it."
covers = ["CAP-12", "CAP-13"]
after = []
hitl = true
refine = true
risk = "medium"
plan_checkpoint = true
done_checkpoint = true
references = ["docs/adr/0012-headless-sessions-capture-and-mocks.md", "docs/spec/engine/rpgcode-functions.md", "docs/guardrails.md"]
notes = ["Kind: specification. Backlog; no Sprint.", "Harness only; no core change."]

