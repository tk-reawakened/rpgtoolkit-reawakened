[[entry]]
id = 3
tracker_id = "#721"
type = "story"
title = "Start states and typed fixtures"
description = "Start a session in boot, scene, save or prefix mode, and apply typed fixtures (placePlayer, giveItem, setVariable and the others in the reference) compiled to an RPGCode setup program."
verify = "1. boot, scene, save (served through the mocked loadBlob) and prefix (fast-forwarded input log) all start and reach the expected state hash in tests.\n2. Fixtures compile only to built-ins documented in docs/spec; the generated program is written out with the session for inspection.\n3. Scene mode runs it as the scene program; boot mode runs it through an asset-overlay wrapper around the game's start-up program. If the boot route proves impossible, stop and record a separate ticket for the snapshot fallback (ADR 0012 Decision 2) instead of changing core.\n4. Fixtures never edit state JSON.\n5. core unchanged; goldens unchanged."
covers = ["CAP-12", "CAP-13"]
after = [2]
hitl = false
refine = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
