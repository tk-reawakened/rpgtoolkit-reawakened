[[entry]]
id = 6
tracker_id = "#724"
type = "story"
title = "MP4 export through a user-installed FFmpeg"
description = "Produce MP4 (H.264 video, AAC audio) from the masters by starting a user-installed FFmpeg as a separate process. Video export needs FFmpeg, installed by the user."
verify = "1. FFmpeg is found on PATH or at a configured path, started as a separate process, fed raw frames and PCM through pipes or the master files, and never linked, vendored, downloaded or shipped.\n2. The harness checks ffmpeg -version and the needed encoders, and reports exactly what is missing.\n3. Without FFmpeg, MP4 export fails with one clear diagnostic telling the user to install FFmpeg; screenshots and masters still work.\n4. The licence gate shows no FFmpeg in any dependency or shipped tree.\n5. MP4 output is never compared in tests; tests compare masters. core unchanged; goldens unchanged."
covers = ["CAP-12"]
after = [5]
hitl = true
refine = true
risk = "medium"
