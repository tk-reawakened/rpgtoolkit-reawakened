[[entry]]
id = 3
tracker_id = "#383"
type = "spike"
title = "Font strategy spike: which pure TypeScript or JavaScript font library, if any, may enter core"
description = "Research-gated (AD-15, G2, G3, G6), after entry 1's `FontRef` and metrics rulings: tests the candidates of discovery/render-readiness.md F-14 to F-17, opentype.js 2.0.0 first (a first probe passed; Typr, fontkit and fonteditor-core are recorded as weaker), against a written checklist: the Blue Oak rating of the package and anything it bundles, a pinned version, loading and parsing under `core`'s tsconfig (the tarball ships no type declarations, so a local one is needed) with no host global touched, a log of every `Math` member executed, a static census of every `Math` member, every `**` and every host global in the shipped bundle with its reachability from the exact API the wrapper would call (the wrapper must avoid the unvetted paths, or a vendored subset removes them), identical outline hashes on V8 and JavaScriptCore for the bundled test fonts, and the size cost. It also owns the bundled font files: reads the licence terms of the candidate default fonts (the owner chose Liberation Sans as the default font on 2026-10-17, with Liberation Serif and Liberation Mono as the Times New Roman and Courier New substitutes unless the owner says Sans only; the family is licensed OFL-1.1 with the Reserved Font Name \"Liberation\" (and Arimo, Tinos and Cousine for the digitised data), so a modified or subset file must be renamed, which entry 9 avoids by shipping unmodified files; the pinned `tools/licences/blue-oak-list.json` has no OFL entry; the owner ruled on 2026-10-17 that the bundled fonts are the upstream OFL-1.1 Liberation releases, so this entry writes the ADR 0003 amendment admitting OFL-1.1 for font assets the project itself bundles and for nothing else (any other open font licence is judged case by case under ADR 0003 rule 2, as an exception in its own pull request; fonts as data, never linked into code; the licence text and any Reserved Font Name terms honoured in `THIRD_PARTY_NOTICES`; a user's own fonts are unaffected) and the gate change that entry 9 makes when it adds the files), settles the TrueType default and test fonts and the bundled bitmap fallback font (authored in this repository or licensed), with their licence text; writes the verdict and the owner's choice (library, vendored subset, or hand-written parser) to `discovery/font-library-spike.md` and adds the library note to AD-15. It adds nothing to the `core` allowlist."
verify = "The note names the chosen path with the evidence for each checklist line, including the static census, or names the line each candidate failed and the owner's fallback; the default, test and fallback fonts each have a stated licence; `pnpm licence` still passes with nothing added; the owner approves."
