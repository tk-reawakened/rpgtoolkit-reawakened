s a read-only state view; an `input.key` wait stores the input sequence number at park, its poll returns the lowest unclaimed key at or after that number, the engine records the claim in the `engine` section, where the rest of the same waits phase sees it and where neither `input` nor `vm` is written, and the input owner prunes claimed keys; `get` and `clearBuffer` of movement-triggers use the same protocol; so two waiters and two keys resolve once each); the open-tick cursor, the resume modes (`continue` and a one-instruction `step`) and the `ticksRun` count of `setBreakpoints`; the AD-16 change that this epic posts `audio` effects instead of emitting `AudioCue`s; and the inputs of `composeBoard` (the world view with run-time edits, sprites, tick, `alpha`). Amends AD-1, AD-3, AD-8, AD-9, AD-10, AD-15, AD-16, AD-27, AD-29 and AD-33 only where a ruling needs it."
