# tickets.toml — planned entries of epic-board-rendering, in build order. tickets.py reads it.
# Table order is the build order; `id` is a stable name. Ids 1 to 28 are the inception draft's; entries 29, 30 and 31 were added after the first independent review (2026-10-16) and stand earlier in the table where their prerequisites need them (29 after 1, 30 after 19, 31 after 20).
# Decisions (Jensen, 2026-10-16): R-55 is fixed with strict layer and y order; fonts use a vetted permissive library, none selected yet (entry 3); R-15, R-01 and R-06 settled; golden PNGs from an independent renderer are seeds and regression oracles, not proof of legacy pixel parity (ledger classes, entries 4 and 17). See discovery/inception-proposal.md and discovery/render-readiness.md.
# Rulings are split by who needs them: entry 1 rules what the oracles, tracer, rasteriser, compositor, camera, effects and waits need; entry 29 rules the presentation, lifecycle and audio-cue rows that entries 20 to 25 and 31 need.
# Fixture and oracle producers come first: entry 4 (2D scenes, the scene schema, the reference renderer, the ledger) and entry 17 (both iso boards) before any consumer; text, message window and transitions have no independent producer and are regression baselines (ledger).
# Shared files and their ordered owners (nothing here claims disjoint lanes): `save/sections.ts` (entry 5 splits it; each section entry then edits only its own module); the `core/script` edits in this order: the effect hook (11), `waits.ts` and the `runWaitsPhase` view argument (19), the `virtuals.ts` reads (12, then 24); the effect bus, its pending queue and `postEffect` in `core/engine` (11; 19 only registers appliers); `core/render/compose.ts` (14, 15, 18); `core/engine` (5, 11, 19, 30, 20, 31); `core/raster` (6, 7, 8, 9, in that order: 8 waits on 7); `core/world` (10, then 12 and 16 in separate modules); the reset seam (31); the `fx` section (22, 23); the `ui` section (21, 25). Entries 21, 22 and 24 have no dependency between them and share only the `render` pack barrel and `core/render/index.ts`, each appending one export line that the refactor sweep reconciles.
# Lanes after the tracer, by topic: raster and text (6, 7, 8, 9), world and compositor (10, 13, 14, 15, 18), packs and built-ins (11, 12), camera (16), engine (19, 30, 20, 31), UI and effects (21 to 25).

