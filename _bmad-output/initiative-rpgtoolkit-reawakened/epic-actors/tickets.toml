# Lanes: A core/actors (3, 5, 6, 7, 8, 10; 3 owns the barrel and section), B script bindings (4), C packages and .gam (11, 12).
# The core/battle boundary of the 2026-10-19 owner decisions: core owns actor data and defaults, packages own battle systems.

