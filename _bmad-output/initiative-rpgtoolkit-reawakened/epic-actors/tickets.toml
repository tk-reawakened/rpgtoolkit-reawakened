type = "story"
title = "Core interpretation rules: fallen, status countdown, equipment bonuses, level-up"
description = "Implements the core defaults ruled in 20.1: fallen when HP <= 0 is a retained, behaviour-overridable state; revival is the state changing back; status effects count down through `advanceStatus(n)` with the battle script choosing when a round passes; equipment bonuses apply from item data; and level-up derives from character data. Each is a closed hook with a core default; transitions return plain data for 20.9 to emit, with `source` an actor id or null, and `beforeDamage` is sent by the battle thread rather than by a listener."
