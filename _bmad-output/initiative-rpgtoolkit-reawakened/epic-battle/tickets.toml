# tickets.toml — planned entries of epic-battle, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is the owner-approved docs checkpoint.
# Lanes: A docs/state (1, 2), B API (3), C package rules (4-8), D starts and media (9, 10), E UI and custom-program proof (11, 12), F battle-thread event seam (14); 13 reconciles seams and closes the epic.
# The 2026-10-19 owner re-slice: core owns actor data and the battle section (fighter references and charge), the stock_battle RPGCode package owns the loop, rules, AI and UI.

