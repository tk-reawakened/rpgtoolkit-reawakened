[[entry]]
id = 4
tracker_id = "#507"
type = "story"
title = "Charge-bar turns: the ATB loop"
description = "Implements the stock battle package's charge-bar loop on one battle thread (BAT-4): initialise each fighter's charge with one seeded draw from 0 to its threshold minus 1 (enemies then players, in party order, fallen players included), and run one pass per engine tick (a `threadSleep` of 1/60 second, which the ruled conversion turns into one tick). In each pass, visit enemies then players in party order: a fighter already at or above its threshold takes its whole turn on the spot, and nobody charges while any turn is in progress; every other living, unfrozen fighter gains its rate (3, plus 2 per speed status, minus 2 per slow status, with no floor and no ceiling) and, if it crosses its threshold, acts in the next pass. Players act at 75 and enemies at 123. A disabled fighter does not charge (a charge at or above the threshold is set to one below it); a fallen fighter keeps its charge. The acting fighter's charge resets to 0 after its turn, and the loop is driven from the package's `battle` command."
verify = "Seeded runs reproduce the initial charges and the charge timeline; speed, slow, disable and multiple effects change the rate exactly as ruled, including a rate at or below zero; players act at 75 and enemies at 123; no fighter's charge changes during another fighter's turn; a fighter crossing its threshold acts in the next pass; release resets; a save/restore or replay produces the same turn order; a multi-tick catch-up burst gives one pass per simulated tick; the loop consumes whole ticks and no wall clock, `Date` or `Math.random`."
covers = ["CAP-9"]
after = [3, "20.11"]
hitl = false
risk = "high"
references = [
  "spec - docs/spec/engine/battle.md as ruled by 7.1 (BAT-4)",
  "spec - docs/spec/engine/plugins-and-battle.md#e-72",
  "code - packages/core/src/ports/wait.ts, packages/core/src/script/waits.ts",
]

[[entry]]
id = 5
tracker_id = "#508"
type = "story"
title = "Player actions and damage: attacks, criticals, specials and items"
description = "Implements the player's Fight, Special Move and Item actions inside the stock package (BAT-5). The ordinary attack is the E-74 rule of facts round 10, unchanged: one seeded whole-percentage luck draw from -10 to +9 in exact integer arithmetic with the fraction dropped toward zero, then the offensive and defensive critical draws (-1 means no draw), DP subtracted unless critical, a floor of 1, to HP or SMP. A special has no luck, critical, DP or floor: its FP comes off the target's HP, its target-SMP off the target's SMP and its cost off the user's SMP, each stopping at 0 (and, by the proposed departure, a heal stopping at the maximum); an unaffordable special is refused; after the effect the user's animation, the move's animation, its program and its status follow in that order. An item adds its battle HP and SMP to the target, kept between 0 and the maximum, through an inventory port with a test double and one posted consume effect. `attackall`/`drainall` hit each living target without criticals; damage goes through the actor method so `fallen` fires once, before which the package sends `beforeDamage` (7.14)."
verify = "A seeded damage table reproduces the E-74 values at the edges (the -10 and +9 draws, DP larger than damage); a critical bypasses DP; the minimum is 1 for attacks only; a special applies no luck, critical, DP or floor and a 0-FP special does nothing; an item stays within 0 and the maximum; an unaffordable special is refused; the special's animation, program and status run in the ruled order; an item posts exactly one consume effect through the test double and never edits the item list; `attackall`/`drainall` apply without criticals; `fallen` fires once per lethal hit."
covers = ["CAP-9"]
after = [3, 4, "20.6"]
hitl = false
risk = "high"
references = [
  "spec - docs/spec/engine/battle.md as ruled by 7.1 (BAT-4, BAT-5)",
  "spec - docs/spec/engine/plugins-and-battle.md#e-74",
