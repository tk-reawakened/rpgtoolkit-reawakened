[[entry]]
id = 7
tracker_id = "#510"
type = "story"
title = "Enemy AI: four levels and a custom AI program"
description = "Implements E-76 enemy AI in the stock package (BAT-7): level 0 a fair coin between an ordinary attack on a random living player and trying a special; level 1 always tries a special with random targets; levels 2 and 3 as 0 and 1 with the weakest target (lowest current HP, earlier party slot on a tie, fallen skipped). Trying a special picks with equal chances among specials the enemy can afford (the battle flag is not checked) and otherwise attacks. FP below 0 is healing and goes to a random living ally at levels 0 and 1 and the lowest-HP living ally at levels 2 and 3. A custom `useCode` program runs with `source` as the enemy and `target` as a random living player and must act itself; a program that does nothing spends the turn. The draw order is fixed; with no living player the turn is skipped; the `ai(level)` built-in sets the acting enemy's level and rejects a level outside 0-3."
verify = "Each of the four levels makes the ruled choices over a seeded run; an unaffordable special falls back to an ordinary attack; a healing special targets a random ally at levels 0 and 1 and the lowest-HP ally at levels 2 and 3, and a harmful one the player party; a custom AI program drives the action and a no-op program spends the turn; every random draw is in the ruled order with a deterministic tie-break; no division by zero when no player is alive; an AI program error is reported and ends that turn without ending the battle."
covers = ["CAP-9"]
after = [4, 5, 6]
hitl = false
risk = "medium"
references = [
  "spec - docs/spec/engine/battle.md as ruled by 7.1 (BAT-7)",
  "spec - docs/spec/engine/plugins-and-battle.md#e-76",
]

[[entry]]
id = 8
tracker_id = "#511"
type = "story"
title = "Outcomes, rewards and level-up: win, run and lose"
description = "Implements E-77 and E-78 outcomes (BAT-8, BAT-12): `battle.finish` maps the outcome to codes 0-4 and the outcome compatibility adapter (pending owner review) applies 0, 2 and 4 from generic core operations while 1 and 3 apply nothing. Run is blocked for the whole fight if any enemy forbids it (still listed, cancel sound, turn kept); otherwise it succeeds on a seeded 2-in-5 draw and a failed attempt spends the turn; a success runs one run program (the last enemy's that has one) and gives no rewards. A win posts the summed gold silently as one inventory effect, shows the experience message, gives every party member (fallen included) the full experience with each level-up running the level-up program, the 20.6 default stat rise and a level-gained message, shows the gold message, and runs one win program (the last enemy's that has one). A loss (every player at 0 HP, checked before the win) runs the game-over program without a reset, or shows the message and calls `reset()`. `defeated` is emitted once per enemy per battle and re-emitted on the game as `stock_battle.defeated`; the maximum-level retry of 3.1 is not reproduced."
verify = "Seeded win, run and lose paths produce the ruled outcomes, rewards and order; experience goes in full to every party member, fallen included, and a member at maximum level never loops; gold is posted exactly once as an inventory effect and the test double consumes it; an allowed run succeeds on the seeded 2-in-5 draw and a failed one spends the turn, while a blocked run keeps it; one run program and one win program run; `defeated` fires once per enemy per battle, not on a run, and is re-emitted as `stock_battle.defeated`; the game-over program runs without a reset or `reset()` is called; a simultaneous fall is a loss."
