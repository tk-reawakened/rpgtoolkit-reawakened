title = "Rulings: the battle package boundary, battle state, the facing API and the defeated event"
description = "Doc-first (G7), docs only: records the owner-relayed 3.1 battle facts as extraction round 11 and writes docs/spec/engine/battle.md (BAT-1 to BAT-15) to settle the battle package boundary (the core owns the `battle` section with fighter references and charge, plus the actor model; the `stock_battle` package owns the loop, charge rate, damage, status round effects, AI, the sequence after an outcome, music cues and UI), the `BattleSection` shape, the full mapping of E-79's callbacks 114-132 (the legacy `fightTick` callback remains documented but is not a Reawakened core operation), the one-battle-thread loop with nobody charging during a turn, damage for attacks, specials and items, status ticks once per turn of their fighter, the four AI levels, the run chance and reward order, the `defeated` event and its `stock_battle.defeated` re-emit, R-57 (including the legacy-callback-only `skill = -1` sentinel), R-16, R-11 (`.spc` flags: 0 = usable), outcomes 0-4 and the outcome compatibility adapter, the no-enemies message, battle music, the party source, the hazards not reproduced, and that the default UI uses existing 3.1 draw primitives. Amends E-71 to E-79, closes R-57, and updates EMIT-13's `defeated` row, AD-10's `battle` row and the `.spc` flag note. Initial Reawakened rules were approved by the owner on 2026-10-25; approved amendments are dated in the spec and plan change logs."
