# tickets.toml — planned entries of epic-movement-triggers, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is an owner-approval docs checkpoint (pending).
# The movement oracle is authored from docs/spec and recorded input; it is not a legacy pixel-parity claim.
# Shared-seam owners: 3 owns sprites, 6 owns input extensions, 7 owns movement waits/built-in registration,
# 8 owns triggers, and 12 performs the final phase/reset/catalogue/barrel reconciliation.

