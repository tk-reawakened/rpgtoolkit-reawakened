# tickets.draft.toml — DRAFT breakdown of epic-web-runner-packaging, in build order.
#
# NOT PUBLISHED, NOT THE STORE. This file is deliberately not named `tickets.toml`, so
# `tickets.py` does not read it and no GitHub issue has been created from it. It becomes the
# epic's `tickets.toml` only when the owner approves `discovery/inception-proposal.md`.
#
# Cross-epic `after` pins, and why these and not others (proposal section 2):
# - "4.6" and "4.26" on entry 4: the conformance vectors and the golden scenes/ledger it replays.
# - "6.15" on entry 5: the audio protocol schema and vectors the cue player is checked against.
# - "8.9" on entry 9: the canonical save path whose blobs the browser must store and replay.
# - "16.8" on entry 14: the TK2 decoder registration that lets the six TK2 corpus games load.
# - Nothing pins epic 7: 34 of its 35 entries are done and the one open item (7.34 / #805) is an
#   evidence-and-ruling question about save hashes that no entry here reads. `tickets.py` will
#   report `unpinned_after` for `epic-battle` until the owner either removes that item from epic 9's
#   `after` or names the battle entry they want pinned (proposal ask A-03).
# - Entry 7 cites 2.12 (the landed distribution-package writer) as a reference only, because epic 9
#   does not declare epic 2; adding epic 2 to the epic's `after` is the owner's call (ask A-04).
#
# Tickets get `tracker_id` at publication (`tools/create-epic-on-github.py` needs a breakdown first,
# which is issue #882). The last table position is the build order. One lane per run of entries; the
# only shared file is `packages/runner-web/src/index.ts`, owned by entry 3 and only extended by 4, 5,
# 7 and 9, which `after` sequences.

[[entry]]
id = 1
type = "story"
title = "Rulings: the runner boundary, the desktop shell, image storage, load modes and mobile scope"
description = "Merges this envelope's two `## Notes` headings into one, adds the four `Source conflict:` lines the inception found, and records the owner's rulings — the runner-boundary contract (D-3), the desktop shell spike's owner and evidence bar (D-1), the stored image format and whether BMP and GIF transcode (D-2), load modes, the prefetch threshold and prefetch ownership (D-4), the offline service worker (D-5), the mobile wrapper's scope (D-6), the GPU golden tolerance (D-7), the web build tool (D-8), the browser lane (D-9), SF3 and the CSP note (D-10) and the player page and its AD-22 subpath (D-11) — as dated Decision lines, with each spec or guard-rail amendment in its own docs-first commit (G7 rule 4); D-1, D-8, D-9 must be decided, not left open, because entries 3, 10 and 11 cannot start without them."
verify = "One `## Notes` section holds a dated owner line for D-1, D-3, D-4, D-5, D-6, D-8 and D-9 and each of the four `Source conflict:` lines, every other ruling is either decided or an open question with a named owner and the entries it would change, and every amendment to docs/spec/ or docs/guardrails.md is a separate docs commit that no code commit precedes."
covers = ["CAP-12"]
after = []
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
references = ["discovery - _bmad-output/initiative-rpgtoolkit-reawakened/epic-web-runner-packaging/discovery/inception-proposal.md, sections 3 and 7", "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-5, AD-6, AD-17, AD-22 and the Deferred list", "reference - docs/architecture-options.md, section 8 (desktop shell)"]

[[entry]]
