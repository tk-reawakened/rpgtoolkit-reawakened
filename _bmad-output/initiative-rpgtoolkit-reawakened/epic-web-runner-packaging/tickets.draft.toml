title = "Core: the prefetch planner and the AD-5 hint wire"
description = "Adds the deterministic prefetch planner to core and the hint wire shape at the AD-5 seam — the `now`, `next` and `always` tiers over the current board, edge-linked and literal `send` boards, the battle background and its sounds, and the menu and cursor sounds, plus audio's share from audio-media.md#audio-prefetch — as a request that never blocks, never changes state and never appears in a state or draw hash, and carries it through every consumer the union touches: the AD-17/AD-5 doc-first amendment of the request list, the `HOST_REQUEST_KINDS` exhaustiveness list in `core/script/manifest.ts`, and `runner-harness`'s `isRequest` guard so a hint is observed rather than dropped."
verify = "The engine emits the ruled tiered hints for the demo board, a battle background and the menu sounds; `HOST_REQUEST_KINDS` and the request union compile together and an exhaustive switch keeps its `never` default; `pnpm golden` and `pnpm closing` state and draw hashes are byte-identical when the same log runs against a host that consumes hints and one that discards them; and the latency-fuzz replay test still passes."
covers = ["CAP-12"]
after = [2]
hitl = false
risk = "medium"
references = ["spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-5, AD-17", "spec - docs/spec/engine/audio-media.md#audio-prefetch", "code - packages/core/src/ports/requests.ts, packages/core/src/script/manifest.ts, packages/runner-harness/src/driver.ts"]

[[entry]]
id = 9
type = "story"
title = "Load modes, storage tiers and the offline service worker"
description = "Implements the two load modes with a measured threshold rather than a guessed one — whole-package below it, behind a progress screen, streaming above it driven by the entry 8 plan — with memory, then Cache Storage or OPFS, then network decode-ahead in a worker, save blobs stored under the AD-17 keys the engine's save path produces (entry 8.9), `navigator.storage.persist()` with a streaming fallback on quota errors, the last-frame stall presentation with a spinner only after about 300 ms, and a service worker for the player that updates on next launch and never mid-session."
verify = "A second launch serves the game from cache with the network blocked and boots to `demo`'s tick-120 state hash `bff947dce3a11b4f`, a save written before that reload restores under the same `GameId` key, every blocking stall in a streaming run is on an asset outside the plan and none on a hinted one, and a quota failure is reported as a state with the streaming fallback taken rather than a silent stop."
covers = ["CAP-12"]
after = [3, 7, 8, "8.9"]
hitl = false
risk = "high"
plan_checkpoint = true
references = ["spec - docs/spec/engine/audio-media.md#audio-prefetch", "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-17, Operations (CSP, PWA update policy)", "decision - D-4 and D-5 of discovery/inception-proposal.md"]

