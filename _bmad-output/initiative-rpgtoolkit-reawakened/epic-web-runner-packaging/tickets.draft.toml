title = "The runner contract page, its message schema and the vector kit"
description = "Writes the normative runner page docs/spec/engine/runners.md under ADR 0007 — what a runner owes the core and what it may decide for draw-list replay, audio, input events and AD-5 requests — publishes one language-neutral JSON Schema beside the existing audio schema, and defines the vector-kit format plus a generator whose --check mode proves the schema, the vectors and the TypeScript types do not drift."
verify = "The page exists with an anchor per record kind, the schema validates every committed vector, `pnpm runner-protocol:check` fails when a type, the schema or a vector changes alone, and the audio protocol's existing schema and vectors are reused rather than duplicated."
covers = ["CAP-12"]
after = [1]
hitl = false
risk = "medium"
references = ["spec - docs/spec/engine/audio-media.md#epic9-audio-handoff and #cue-player", "precedent - packages/synth/schema/audio-protocol-v1.schema.json and tools/fixtures/audio-protocol/generate.mjs", "precedent - tools/fixtures/conformance/raster/vectors.json", "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-1, AD-3, AD-14"]

[[entry]]
id = 3
type = "story"
title = "Tracer bullet: a sample game boots and presents a frame in a headless browser from the same core build"
description = "Creates `packages/runner-web` with its `src/index.ts` public entry and a declared `./app` subpath for the player page (the D-11 AD-22 amendment), its root `tsconfig.json` project reference and its `tools/no-skips` group and CI `unit` matrix row; bundles `core` and `runner-harness` for the browser from the same `tsc -b` output the headless lane uses (esbuild, one IIFE per entry point per D-8), adds a static asset server that serves a fetched game folder or a package, wires the input path, presents the composed frame through the reference rasteriser, and adds the Playwright lane as a required `gate` dependency that runs `pnpm fixtures:fetch` first and registers its own browser group."
verify = "One Playwright run boots `demo` from the served fixture folder in headless Chromium and reports, at tick 120, state hash `bff947dce3a11b4f` and draw hash `9a40be8a0b5ca816` — the values committed in golden/regression/closing.json for that game and tick — while presenting the frame; the same run reports the browser probes the rulings need (VP9 in WebM with Opus decodable, and no WebAssembly instantiation on the shipped default path); the lane is a required `gate` dependency and fails on a clean runner; and every browser test reports its own duration under one second or says why."
covers = ["CAP-12"]
after = [2]
hitl = false
risk = "high"
plan_checkpoint = true
references = ["spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-1, AD-4, AD-22, Operations (CSP and single-file IIFE bundles)", "baseline - golden/regression/closing.json and golden/closing/plan.json", "spec - docs/spec/engine/audio-media.md#video-policy and #audio-browser-test", "fixtures - tools/fixtures/sources.json and .gitignore `/fixtures/`", "constraint - docs/guardrails.md, G5 rule 4 (sample games are fetched, never committed)"]

[[entry]]
id = 4
type = "story"
title = "render-webgl2: the WebGL2 replayer, the presented frame and the runner's presenter"
description = "Builds the `render-webgl2` package as a draw-list replayer and nothing more (G4) — all eight commands of AD-3's union, the normative AD-3 pixel pipeline for key, tint and the three blends, scratch targets via pushTarget/popTarget, the AD-27 surface pull with `engine.surfacePixels(id, rev)`, texture and glyph-atlas caches that can be flushed every frame, and the logical-to-physical viewport scaling AD-33 requires (integer-scaled letterbox and expand-viewport) — gives it its `tools/no-skips` group and CI `unit` matrix row, and makes it runner-web's presenter so the shipped player draws through it while the reference rasteriser stays the oracle (D-11's AD-22 amendment keeps both behind declared subpaths)."
verify = "Every vector in tools/fixtures/conformance/raster/ (vectors, text, truetype) and every gating row of golden/ledger.json replays through WebGL2 in headless Chromium and matches the reference rasteriser exactly for colour-key decisions and tint, within the D-7 bound for blend arithmetic, with the worst per-channel difference reported per vector; the runner-web test that flushes every cache every frame (AD-27) is pixel-identical to the same frame presented through the reference rasteriser."
covers = ["CAP-12", "CAP-6"]
after = [3, "4.6", "4.26"]
hitl = false
risk = "high"
plan_checkpoint = true
references = ["spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-3 (pixel pipeline), AD-4, AD-27, AD-33", "spec - docs/spec/engine/parity-checklist.md#golden-image-oracle", "spec - docs/spec/engine/display-input-audio.md#reawakened-light-and-raster-arithmetic", "spec - _bmad-output/initiative-rpgtoolkit-reawakened/spec-rpgtoolkit-reawakened/packages.md, render-webgl2"]
notes = ["covers names CAP-6 as well because packages.md assigns render-webgl2 to CAP-6, 12 and 15 and epic board-rendering excludes the replayer by name; drop CAP-6 if the owner prefers covers to equal the epic's own cover, or add CAP-6 to the epic's covers with a sentence naming the replayer as this epic's part (proposal ask A-02)."]

