[[entry]]
id = 10
tracker_id = "#936"
notes = ["Gap recorded 2026-11-03 (read-only audit, evidence-based): the player application itself is unbuilt — Electron launch resolution (--game/deep link, player.json, baked default, library), the baked-package export and the editor-exclusion are not implemented, so acceptance rests on no merged work yet. Remaining evidence: three-OS cold-start acceptance in CI covering all four launch paths, the four measurements (WebGL2, D-7 blend bound, audio length, package from disk), one PWA-vs-player frame-equality check, and the explicit done-checkpoint record of a person accepting ADR 0013 (the ADR is already marked Accepted 2026-10-31 citing the owner's D-1 ruling; the signature line is what is missing). Not a device or review blocker: it is implementation that would satisfy the verify.", "Ruling (owner: Jensen, 2026-11-10, opening this entry's plan checkpoint): this entry builds the desktop launch seam and the library registry itself rather than leaving them to epic game-launcher. It implements the ruled order in `runner-desktop` — `--game`, the `tkr://play` deep link, `player.json` beside the executable or in the application-data directory, a baked default read from the application's resources, and a library fallback that states why — and it owns the `library.schema = 1` document and its `sha256`/`size` integrity refusal (`docs/spec/engine/launcher.md#storage-and-registry`), written in the application-data directory beside the saves. The export pipeline that bakes a package into `resources/` is 25.6's; this entry proves the read slot with a harness-baked package. Epic game-launcher keeps the conformance suite over this seam plus the web and mobile limbs (25.5), the Launcher UI the seam feeds (25.4), marketplace and local ingestion (25.3, 25.2), the registry's install/marketplace enrichment (25.1) and standalone export (25.6); the step-4 fallback here is a library listing that states why, and 25.4 replaces that view with the Launcher UI. ADR 0013 is already Accepted (2026-10-31), so the done checkpoint records a person accepting the four measurements and the parity check, not the ADR a second time. Plan: `story-player-application-the-ruled-electron-shell-launch-resolution-library-and-default-game-plan.md`."]
type = "story"
title = "Player application: the ruled Electron shell, launch resolution, library and default game"
description = "Builds the **player** application on `runner-desktop` (entry 11) rather than settling a shell choice: **Electron 45.2.1**, player-only and carrying no editor code or chrome, serving its pages over the `app://` scheme entry 11 registers and registering no service worker because a desktop application is already offline. It resolves the game it opens in the ruled order — an explicit `--game` argument or a deep link, then `player.json` beside the executable or in the OS configuration directory when installed, then an embedded default project baked in at export, then the installed-game library — with no per-game stub and no file association, because the single-project case is configuration, not packaging, and handing someone \"the player plus my game\" is a pre-configured build or a config file. It adds the **library** (a versioned registry in the application-data directory holding each installed package's identity, path on disk and per-game settings, outside the AD-17 save blobs, where installing means registering a package) with the default-game setting, so a cold start opens the configured or baked game and otherwise shows the library and says why. It writes **ADR 0013** — the shell, the `app://` requirement, the resolution order, and one `guardrail-exception: G6 ADR-0013` inventory that names **both** desktop binaries from the same Electron version, the player's artefact read here and the editor's when epic `desktop-shell` first builds it — and measures the **exported player** with its baked default, plus the PWA, on Chromium and on macOS, Windows and Linux in CI, adding no WKWebView, WebView2 or WebKitGTK leg unless a system-webview application is ever shipped. The editor application is epic `desktop-shell`'s; this entry neither builds nor measures it. **The shell choice is closed:** Tauri stays the recorded fallback and its flip conditions are the escape route, not a comparison to be re-run, and a later divergence needs its own ADR superseding 0013."
verify = "A cold start of the exported player opens, in order: the game named by `--game`; else the project named by `player.json`; else the baked default; else the library with a stated reason — each observed on macOS, Windows and Linux in CI; for the baked-default and library cases it reports the four measurements (WebGL2 present, the D-7 blend bound within one unit per channel, audio of the expected length, and the package resolving from disk) plus one check that the same draw list renders the same frame in the PWA build and in the player within that bound; and a person accepts ADR 0013, which cites those measurements, records the owner's ruling and the Tauri fallback with its flip conditions, carries the single G6 inventory naming both binaries, and is cited by epic desktop-shell. The library case runs twice — with the demo package installed (it opens that entry and reports the four measurements) and empty (it states why and never renders a blank window) — the empty view is replaced by epic 25's Launcher UI (entry 25.4) and the export pipeline that bakes a package into the resources slot is 25.6's, so this entry proves the read slot against a harness-baked package."
covers = ["CAP-12"]
