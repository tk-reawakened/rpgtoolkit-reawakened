# tickets.toml — planned entries of epic-web-runner-packaging, in build order. tickets.py reads it.
#
# Published 2026-10-31 with the owner's approval of discovery/inception-proposal.md; the proposal keeps its
# `status: draft — awaiting owner approval` line as the record of what was reviewed. The owner approved
# publishing the breakdown, not the rulings in entry 1.
#
# Cross-epic `after` pins, and why these and not others (proposal section 2, the pinned-provider map):
# - "4.6" and "4.26" on entry 4: the conformance vectors and the golden scenes/ledger it replays.
# - "6.15" on entry 5: the audio protocol schema and vectors the cue player is checked against.
# - "8.9" on entry 9: the canonical save path whose blobs the browser must store and restore.
# - "16.8" on entry 14: the TK2 decoder registration that lets the six TK2 corpus games load.
# - Nothing pins epic 7: 34 of its 35 entries are done and the one open item (7.34 / #805) is an
#   evidence-and-ruling question about save hashes that no entry here reads. `tickets.py` therefore reports
#   `unpinned_after` for `epic-battle` until the owner either removes that item from epic 9's `after` or
#   names the battle entry to pin (proposal ask A-03).
# - Entry 7 cites 2.12 (the landed distribution-package writer) as a reference only, because epic 9 does
#   not declare epic 2; adding epic 2 to the epic's `after` is the owner's call (ask A-04).
#
# Table order is the build order. One lane per run of entries; the only shared file is
# `packages/runner-web/src/index.ts`, owned by entry 3 and only extended by 4, 5, 7 and 9, which `after`
# sequences. `tracker_id` is written by tools/migrate-tickets-to-github.py.

