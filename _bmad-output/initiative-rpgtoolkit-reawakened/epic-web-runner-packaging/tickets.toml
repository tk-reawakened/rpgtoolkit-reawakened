covers = ["CAP-12"]
after = [5]
hitl = false
risk = "medium"
refine = true
references = ["issue - #1043", "proposed fix - PR #1042", "code - packages/runner-web/src/audio-sink.ts"]
notes = ["Ruling (owner: Jensen, 2026-11-11): the spec wins on the buffer size — 2048 frames is what `docs/spec/engine/runners.md#audio` specifies and what its unit test pins, so this entry no longer asks for a 4096 default or a size-only browser assertion. It is closed by measurement instead: dropouts under representative load on the shipped default path, with the capture retained, and the fallback measured rather than assumed. A size assertion may stay only as 2048, and it can never stand in for the measurement.", "Open with the gap recorded 2026-11-06: the AudioWorklet migration (#1165) and the decoder-readiness fix (#1608) changed the default path, but neither proved dropout-free live output under load; an exploratory macOS capture with 40 ms of busy main-thread work every 100 ms showed scheduling contention on the worklet graph, which is the condition this entry must measure rather than infer."]

