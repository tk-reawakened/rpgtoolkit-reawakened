[[entry]]
id = 7
tracker_id = "#711"
type = "story"
title = "Cache surface pixels and use scanline fills and blits"
description = "Keep decoded raster surface Uint8Array buffers live across mutations outside plain GameState, synchronize Base64 lazily or at a serialization boundary, use bounded scanline fills for rectangles and copy scanlines for eligible 1:1 opaque blits, and reuse the decoded raster asset map for canvas text within a tick while preserving exact pixel output."
verify = "Focused tests (surfaces, surface-batch, surface-guard, graphics-builtins, engine) prove bit-identical pixels against plain-buffer and eager-twin models, revision increments, JSON snapshot/restore parity, bounds that cover every pixel a draw routine writes (seeded randomized properties including infinite and NaN coordinates), batch rollback, flush and self-blit semantics, and that a 60-primitive tick writes one screen snapshot instead of one per edit while package code that reads the state mid-thread sees exactly what an eager engine shows; repeated large-canvas operations avoid per-mutation Base64 decode/encode. Core remains free of DOM and Node APIs, and all G1/G3/G5 invariants hold. Reuse of the decoded raster asset map for canvas text is not delivered: it does not apply on this base (see notes)."
covers = []
after = []
hitl = false
risk = "high"
references = ["issue - #711", "epic - #639", "ADR - docs/adr/0002-core-pixels-and-deterministic-maths.md", "architecture - AD-27", "spec - docs/spec/engine/rpgcode-functions.md#e-56 and #e-58", "spec - docs/spec/engine/main-loop-and-startup.md#e-57"]
notes = ["Delivered: live decoded buffers outside GameState; per-command span re-encode with bounds that fail open; script drawing held in working buffers per thread phase and written into canonical snapshots at its end, with flushSurfaceBatch before any non-built-in plugin command, listener or host-object hook runs; self-blits read pre-blit pixels; batching stays on with a main file, package catalogue or phase registrations and is off only with effect appliers or script observers.", "Not applicable on this base: origin/main has no applyCanvasText, so the canvas-text asset-map reuse item is recorded as not applicable rather than invented.", "Not applicable on this base: origin/main has no renderNowOn state. The reserved overlay canvas is the existing optional surfaces.renderNow handle, which the surface hash cache already accepts as an optional key; no fields were added.", "Measured on Node 24.21.0 against origin/main with identical state hashes: 60 direct 640x480 operations plus a hash about 2.5 s before and 48-51 ms after in steady rounds (61-73 ms cold); 60 fillrects over four 640x480 canvases per frame plus a hash about 4.8 s before and 88 ms median after. These are throwaway benchmark results, not test assertions."]

[[entry]]
