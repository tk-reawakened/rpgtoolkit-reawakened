tracker_id = "#712"
type = "story"
title = "Avoid rescanning unchanged surfaces in state hashing"
description = "Avoid re-encoding and rescanning unchanged megabyte surface payloads on every engine.advance() by caching canonical surface fragments or content hashes by surface identity and revision, or materializing Base64 only after a surface revision changes, without changing canonical snapshots or replay hashes."
verify = "Tests prove the cached surface-hash path returns exactly the legacy projection hash after prefix, suffix and non-finite edits, direct bitmap and metadata edits, equal-revision clones, non-ASCII surface keys, every incoming low-byte lane and engine advance with changing pre-surface state; pixel and non-surface changes still change stateHash, identical input/seed replays retain identical per-tick hashes, and JSON/save snapshots remain complete and canonical. Cost is measured by benchmarks recorded in notes, not asserted by a timing test, and the 50 ms budget for 60 direct 640x480 operations plus a hash is not reliably met."
covers = []
after = [7]
hitl = false
risk = "high"
references = ["issue - #712", "epic - #639", "architecture - AD-1, AD-11, AD-27", "guardrails - docs/guardrails.md (G1, G3, G5)"]
notes = ["Delivered: exact FNV-1a per-block transitions learned lazily one incoming low-byte value at a time, capped at 2,048 blocks per game state with eviction of blocks no longer in the state; cached canonical surface fragments that direct edits invalidate; hashes unchanged.", "Not applicable on this base: origin/main has no applyCanvasText or renderNowOn. The hash cache already accepts the existing optional surfaces.renderNow key; no fields were added.", "Measured on Node 24.21.0 against origin/main with identical state hashes: a tick editing four high-entropy 640x480 surfaces while the state prefix changes took about 630 ms median before and 61 ms median after (37 ms on Node 26.8.1, 111 ms on Bun 1.4.2); cold or highly varied surfaces still need sequential hashing."]
