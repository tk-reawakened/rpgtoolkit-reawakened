[[entry]]
id = 5
tracker_id = "#680"
type = "spike"
title = "Plan GitHub ticket tooling around GitHub as source of truth"
description = """Guiding principle: Ideally GitHub replaces the local BMAD ticket process, so that no more PRs have to be opened just to handle tasks (marking done, ticking acceptance, status changes).

Plan how GitHub issues, native sub-issues, project board fields, labels, comments, and checklists can safely support ticket work. This is planning only: do not implement tooling or create implementation tickets until a written design is reviewed by the owner. Any later implementation tickets for these workflows wait on this spike.

Input observations to revalidate:
(a) Body synchronization currently can PATCH all issue bodies because it has no issue-scoping filter or dry-run and ignores --help; an accidental run today rewrote 16 issue bodies, which were restored from edit history. Apply the same safety review to the migration and sub-issue-linking tools.
(b) The owner reports tickets.py find failed globally because two Epic 19 plan files claim ticket 17, halting unrelated workflows; record the actual claimant paths and statuses on the affected owner checkout and `origin/main` because those snapshots differ.
(c) Closing after a PR merges is manual: mark the ticket done, update acceptance with test evidence, sync its issue body, prepare a chore PR, and merge it.
(d) Needed capabilities include a read-only drift check for missing tracker IDs, GitHub state versus ticket status, body drift, missing native sub-issue links, and Fixes-versus-Refs on partial tickets; a check that every ticket has a tracker ID and every open Epic 7 issue matches tickets.toml; native sub-issue linking; and project sprint fields.
(e) The owner's uncommitted local tickets.py edit in the main checkout must be reconciled before any tooling implementation."""
verify = "A decision-ready design in the Epic 23 folder evaluates GitHub as the status and acceptance source of truth, defines the human/director/worker operations and safety rules, addresses migration, records the ticket-17 claimant evidence and owner checkout/base discrepancy, captures the owner's local edit decision separately, and is reviewed by the owner before any implementation ticket is cut."
covers = []
after = []
hitl = true
risk = "medium"
references = ["repo policy — AGENTS.md, GitHub Project is the primary interface", "contributor process — CONTRIBUTING.md, Pick and claim an issue"]
notes = ["Observation: The requested safety review covers tools/sync-issue-bodies.py, tools/migrate-tickets-to-github.py, and tools/link-epics-subissues.py.", "Observation: The owner-reported Epic 19 ticket-17 collision names _bmad-output/initiative-rpgtoolkit-reawakened/epic-rpgcode-platform/story-implement-package-catalogue-loader-and-startup-runtime-plan.md and _bmad-output/initiative-rpgtoolkit-reawakened/epic-rpgcode-platform/story-package-catalogue-loader-runtime-and-package-startup-lifecycle-plan.md; both have status done in the owner checkout. The origin/main worktree has the second plan and a similarly named first-path story leaf (id 17, tracker #562), not the first -plan.md. Reconcile the affected revision before resolving the duplicate; preserve both unless evidence identifies the real plan.", "Observation: The main checkout has an uncommitted one-line change in _bmad/method/scripts/tickets.py that sets a loaded entry's tracker_id to empty instead of reading its tickets.toml value.", "Open question: Should the owner's tracker_id change be retained, revised, or reverted, and what was its intended contract? Record this disposition separately from the ticket-17 plan decision.", "Open question: What planning content stays in the repository, and what becomes generated, a thin pointer, or is retired?", "Open question: How should status and acceptance changes remain auditable when they no longer land through repository PRs?", "Open question: What offline-work and clean-room provenance requirements must the design preserve?", "Open question: How should existing epics and ticket data migrate to the chosen source of truth?", "Open question: Which bmad skills and workflows must change because they currently read tickets.toml or plan files?", "Risk rationale: a poor source-of-truth or write-safety design could lose ticket history or change the wrong GitHub issues."]
done_checkpoint = true


