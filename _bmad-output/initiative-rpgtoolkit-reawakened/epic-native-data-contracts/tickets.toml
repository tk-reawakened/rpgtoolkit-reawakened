title = "The scene contract separates a board's placements from its definition"
description = "Specifies the scene contract at pre-release, written from section 2 of the draft `docs/spec/formats/tkr-authoring.md` so there is one scene contract ([ADR 0019](../../../docs/adr/0019-tkr-authoring-formats.md) amendment of 2026-11-11, point 3), and brings the draft into line with `native-contracts.md` (identity by path, closed top level, `pluginData`). It lists what a `.brd` cannot hold, which is what the scene editor shows as unavailable on a board, and adds the `.tkrscn` registry row. It specifies the contract so placements reference an actor without duplicating it, the existing separate battle scene stays, and no universal all-purpose container appears; it also decides whether a placement may carry a nested `pluginData` door and which plugin ids own which blocks."
verify = "Jensen approves the spec page, and every legacy board field has a row that says where it lands or why it is dropped."
covers = ["E6"]
after = [1, 4, 11, 12]
hitl = true
risk = "high"
notes = [
  "Decision: Jensen, 2026-11-11: the scene, tileset and asset-pack formats come forward into the first release (ADR 0005, second amendment). This story no longer waits for 27.7.",
  "Consequence, for Jensen to confirm when he approves the page: in the first cut a placed sprite refers to a legacy item file, as a board does. \"Placements reference an actor without duplicating it\" is added as a pre-release revision of this contract when 27.7 is approved. The contract stays `1.0.0-pre.N`, so that revision breaks no promise.",
