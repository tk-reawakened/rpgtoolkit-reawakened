[[entry]]
id = 15
tracker_id = "#1829"
type = "story"
title = "Offer a shared Git surface in browser and desktop hosts"
description = "Decide the Git engine and implement ADR 0022 D13.3 through the platform-services `scm` interface: the status of changed documents, a diff preview in the same read-only view as history, stage, commit and a read-only log, for the browser and desktop hosts. A G6 evaluation of the engine (the user's installed git in the desktop host; an in-browser implementation in the PWA) precedes any implementation. Push, pull, remotes and credentials stay out of scope. This story is allocated by the accepted ADR but is deliberately outside epic 11's closing path, so 11.12 and 11.13 do not wait for it."
verify = "With a project under Git, a changed document appears with its status, its diff previews in the read-only viewer, and a staged commit records the change; with the `scm` capability absent the features are absent and the reason is shown; the chosen engine passes the G6 licence inventory and its own ADR is accepted first."
covers = ["CAP-18"]
references = ["Decision: ADR 0022 D13.3 (the standalone surface is allocated here and is outside epic 11's closing path)", "Constraint: G6 licence gate (the Git engine needs its own ADR before it is a dependency)"]
after = [1, 3, 14]
hitl = true
risk = "medium"

