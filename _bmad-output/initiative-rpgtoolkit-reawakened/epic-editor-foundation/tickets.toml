[[entry]]
id = 14
tracker_id = "#1828"
type = "story"
title = "Keep document history, checkpoint groups and package exclusion"
description = "Implement ADR 0022 D12 in shared code: a per-document history of every saved version deduplicated by SHA-256 content hash, checkpoint groups that restore a multi-document operation in one action, named project checkpoints, document and project timelines with read-only preview and restore, and the reserved in-project history folder with its ignore offer and package exclusion. The first task is one measured editing hour that sets the retention floors and the autosave merge window, because D12.8 fixes the structure but not the numbers."
verify = "One measured editing hour's entry counts set the merge window and the retention floors, and the numbers are recorded in ADR 0022 D12.8; a multi-file wizard operation restores to its pre-operation content as one group and reports each file separately; a restore is itself restorable; a produced package contains neither the history folder nor test-only files, and the exporter check fails when either is present."
covers = ["CAP-15", "CAP-18"]
references = ["Decision: ADR 0022 D12 (history, checkpoint groups, location and the retention measurement)", "Spec: docs/spec/formats/packaging-and-paths.md#distribution-package-this-projects-own (the exclusion table this story's package check changes with 12.9)"]
after = [1, 3, 5]
hitl = false
risk = "high"

