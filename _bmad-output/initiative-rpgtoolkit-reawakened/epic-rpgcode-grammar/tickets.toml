[[entry]]
id = 3
tracker_id = "#627"
type = "story"
title = "Build the lexical layer and incremental external scanner"
description = "Create the independent grammar package, native/browser corpus harness and bounded C scanner, with lexical correctness and edit recovery as the first implementation milestone."
verify = "1. Author from LEX-1 through LEX-11: ASCII-insensitive names/keywords without lowercasing input, numeric/exponent versus digit-leading identifier boundaries, sigils/adjacent !=, comment forms, single-line strings and statement terminators.\n2. Cover CR, LF and CRLF, standalone trailing _ with optional comments, continued-line leading * versus comment, EOF/truncated constructs and edits across lexical boundaries.\n3. Serialize and deserialize complete bounded scanner state; repeated recovery must advance or terminate and must not loop on zero-width tokens. Prove scanner restoration across incremental edits and ambiguity recovery.\n4. Run the same spec-authored reviewed cases natively and in browser Wasm; full parse and edit/reparse yield equivalent syntax/ranges, including non-ASCII string text and UTF-8 byte versus UTF-16 positions.\n5. CI exercises both loaders and rejects forbidden runtime-parser imports/oracle inputs; package and scanner remain outside core, with no runtime dependency or golden changes."
covers = ["CAP-14"]
after = [1, 2]
hitl = false
refine = true
risk = "high"
plan_checkpoint = true
done_checkpoint = false
references = ["docs/adr/0011-tree-sitter-rpgcode.md", "docs/spec/engine/rpgcode-language.md#lexical-rules", "docs/spec/formats/rpgcode-program.md#text-form"]
notes = ["Kind: library. Backlog (Todo); no Sprint. Refine before implementation.", "Grammar/scanner/corpus/queries derive from docs/spec, never the runtime parser, its outputs or AST fixtures, real games or legacy source.", "Native/Wasm and incremental/full parity, scanner progress and source-range mapping are acceptance gates. No core runtime changes or golden/hash drift."]

