[[entry]]
id = 1
tracker_id = "#625"
type = "story"
title = "Settle syntax gaps and define the independent corpus contract"
description = "Make the specification sufficient to author a second grammar without consulting the runtime parser. Record the grammar boundary, rule-to-corpus ledger and consumer contracts before grammar implementation."
verify = "1. Audit ADR 0011 against docs/spec, including conflicting by-reference parameter positions. Resolve each ambiguity doc-first with evidence and owner decisions, or create a separately tracked blocker assigned to its affected milestone; never choose silently.\n2. Define stable CST node/field and source-range conventions, the supported dialect boundary and .prg/.rnc tooling associations without introducing an engine file format.\n3. Define a ledger mapping every intended rule and newly authored valid/invalid/edit case to a normative anchor and rule ID; review expected trees before grammar output is available. No runtime parser source, outputs, AST fixtures or real-game source supplies the oracle.\n4. Confirm backtick as XOR, + concatenation and left-associative power below unary minus; distinguish declaration references, return references and expression AND.\n5. Record G1-G7 and that this grammar never participates in execution. 22.1 may close with separately tracked blockers for later milestones. Unresolved lexical rules block 22.3; statement/module gaps block only their affected milestone. No guessed syntax or weakened expected trees."
covers = ["CAP-14"]
after = []
hitl = true
refine = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
references = ["docs/adr/0011-tree-sitter-rpgcode.md", "docs/spec/engine/rpgcode-language.md#lexical-rules", "docs/spec/engine/rpgcode-language.md#keywords-and-structure", "docs/spec/engine/rpgcode-language.md#expressions", "docs/spec/formats/rpgcode-program.md#text-form"]
notes = ["Kind: specification. Backlog (Todo); no Sprint. Refine before implementation.", "Grammar/scanner/corpus/queries derive from docs/spec, never the runtime parser, its outputs or AST fixtures, real games or legacy source.", "Native/Wasm and incremental/full parity, scanner progress and source-range mapping are acceptance gates. No core runtime changes or golden/hash drift."]

