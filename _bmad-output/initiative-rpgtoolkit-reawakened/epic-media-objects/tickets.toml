# tickets.toml — planned entries of epic-media-objects, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is an owner-approval docs checkpoint (pending).
# Lanes: A formats (2), B events (3, 4), C objects (5, 6), D proof (7). 8 reconciles shared barrels and closes the epic.
# Replaces the net-new Epic 6 procedural media surface with objects and events; the 3.1 audio commands are untouched.

