# tickets.toml — planned entries of epic-media-objects, in build order. tickets.py reads it.
# Table order is the build order; ids are stable names. Entry 1 is an owner-approval docs checkpoint (pending).
# Lanes: A formats (2), B events (3, 4), C objects (5, 6), D proof (7). 8 reconciles shared barrels and closes the epic.
# Replaces the net-new Epic 6 procedural media surface with objects and events; the 3.1 audio commands are untouched.

[[entry]]
id = 1
tracker_id = "#480"
type = "story"
title = "Rulings: the media object, its events, the game-file audio settings and the retired surface"
description = "Doc-first (G7), docs only: amends docs/spec/engine/audio-media.md so the author surface is the media object (voice and track objects returned by `mediaPlay` and reached through `media`), its past-tense events and fields, the cancelable `beforePlay` with its source field, the game-file audio settings block, the stale-voice rule and the list of removed procedural commands; records the engine-phase cancelable-emit rule with Epic 19.11; keeps the playback, cue, wait and fade rules."
verify = "The commit touches only docs and affected spec text; every ruling row carries an OWNER marker, evidence and a rejected alternative; the 2026-10-19 owner decisions each map to one ruled row; the removed-command list matches the catalogue names exactly; the 3.1 aliases are listed as unchanged; no later entry relies on unruled behaviour; a person approves the checkpoint."
covers = ["CAP-5", "CAP-7"]
after = ["19.1", "6.17"]
hitl = true
risk = "medium"
plan_checkpoint = true
done_checkpoint = true
references = [
  "spec - docs/spec/engine/audio-media.md (media command family, voices and layers, legacy command mapping, parity ledger, deferrals)",
  "spec - docs/spec/engine/rpgcode-functions.md (audio rows, `mediaplay` is void in 3.1)",
  "spec - emitter and object sections written by 19.1",
  "spine - _bmad-output/initiative-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened/architecture-rpgtoolkit-reawakened.md, AD-10, AD-14, AD-16, AD-32",
  "epic - epic-media-objects.md, Notes",
]

