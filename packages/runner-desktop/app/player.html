<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:;" />
    <title>TK Reawakened player</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; background: #000; color: #ddd; font: 13px/1.4 ui-monospace, monospace; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
      #viewport { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      canvas { image-rendering: pixelated; display: block; flex: none; background: #000; touch-action: none; outline: none; }
      pre { margin: 8px 12px 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="viewport"><canvas id="screen" width="640" height="480" tabindex="0" aria-label="Game screen"></canvas></div>
    <pre id="live-status">Starting live player…</pre>
    <script src="/apps/player-desktop-live.js"></script>
  </body>
</html>
