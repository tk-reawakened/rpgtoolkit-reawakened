<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:;" />
    <title>TK Reawakened player</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100dvh; background: #000; color: #ddd; font: 13px/1.4 ui-monospace, monospace; }
      #viewport { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      canvas { image-rendering: pixelated; display: block; width: 100%; height: 100%; flex: none; background: #000; touch-action: none; outline: none; }
      pre { position: absolute; bottom: 0; left: 0; margin: 12px; padding: 8px; background: rgba(0, 0, 0, 0.8); white-space: pre-wrap; pointer-events: none; }
      #diagnostics { top: 0; bottom: auto; }
      #library { position: absolute; top: 12px; left: 0; }
    </style>
  </head>
  <body>
    <div id="viewport"><canvas id="screen" width="640" height="480" tabindex="0" aria-label="Game screen"></canvas></div>
    <pre id="live-status" hidden>Starting live player…</pre>
    <pre id="diagnostics" hidden></pre>
    <script src="/apps/desktop/player-desktop-live.js"></script>
  </body>
</html>
