<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:;" />
    <title>TK Reawakened player</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; background: #111; color: #ddd; font: 13px/1.4 ui-monospace, monospace; display: grid; grid-template-rows: 1fr auto; }
      #stage { position: relative; display: grid; place-items: center; }
      canvas { image-rendering: pixelated; display: block; margin: auto; background: #000; touch-action: none; outline: none; }
      pre { margin: 8px 12px 12px; white-space: pre-wrap; }
      /* Shown over the last presented frame only after an asset wait of more than 300 ms (stall-overlay.ts). */
      #spinner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
      #spinner[hidden] { display: none; }
      #spinner::before { content: ""; width: 36px; height: 36px; border: 4px solid rgba(255, 255, 255, 0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #spinner::before { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" width="640" height="480" tabindex="0" aria-label="Game screen"></canvas>
      <div id="spinner" role="status" aria-label="Loading" hidden></div>
    </div>
    <pre id="report">booting…</pre>
    <script src="/apps/player.js"></script>
  </body>
</html>
