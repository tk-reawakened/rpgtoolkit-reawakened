name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# The runner image is pinned deliberately: `ubuntu-latest` starts migrating to
# Ubuntu 26 on 2026-10-19, and the golden/oracle checks are validated on 24.04.
# Moving to a new image should be its own deliberate change.
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
      bun: ${{ steps.classify.outputs.bun }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          classify_all() {
            if ! node tools/ci/classify-changes.mjs --force-full; then
              printf 'full=true\nbun=true\n' >> "$GITHUB_OUTPUT"
            fi
          }
          if [ "$EVENT_NAME" = "push" ]; then
            classify_all
          elif git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"; then
            if ! node tools/ci/classify-changes.mjs < "$RUNNER_TEMP/changed-paths"; then
              classify_all
            fi
          else
            echo "::warning::Could not compute the PR diff; running every check."
            classify_all
          fi
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  unit:
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:classify:test
      - run: pnpm test
      - run: pnpm coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: node-test-coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - run: pnpm fixtures:test
      - run: pnpm catalogue:check
      # Command metadata is checked after the TypeScript build; docs remain outside VM state.
      - run: pnpm command-docs:test
      - run: pnpm command-docs:check
      - run: pnpm no-skips:test
      - run: pnpm icons:test
  golden:
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      - run: pnpm fixtures:fetch
      - run: pnpm fixtures:check
      # The format tests skip their sample-game cases when `fixtures/` is absent,
      # which is the case in the `unit` job. Run the whole suite again here, after
      # the fetch, under the no-skips guard (`pnpm test:strict`), so a sample-game
      # case can never pass by skipping.
      - run: pnpm test:strict
      - run: pnpm golden
      # The closing suite boots every fetched sample game through the real engine and compares frames, hashes and
      # diagnostics with the committed regression baselines (ticket 4.28).
      - run: pnpm closing
      # Independent-oracle drift checks (Pillow is a CI-only dev tool, HPND, never shipped).
      - run: python3 -m pip install Pillow
      - run: pnpm oracle:check
      # The corpus gate (epic 2 Done-when 1): `pnpm dump:check` re-runs the dump
      # over both sample games and compares its JSON report with the committed
      # `golden/legacy-corpus.json`. A parser or decoder that drifts fails there,
      # naming the file. Regenerating the expectation is deliberate
      # (`pnpm dump:record`), like a golden (G5).
      - run: pnpm dump:check
  licence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm licence:test
      - run: pnpm licence
  provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm provenance:test
      - run: pnpm provenance
  graph:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm graph:test
      - run: pnpm graph
  golden-bun:
    needs: [changes]
    if: ${{ needs.changes.outputs.bun == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      # `golden:bun` replays the golden and closing suites under Bun against the
      # committed output; the `golden` job already covers the Node replay.
      - run: pnpm fixtures:fetch
      - run: pnpm golden:bun
  gate:
    needs: [changes, typecheck, lint, unit, golden, golden-bun, licence, provenance, graph]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: "${{ toJSON(needs) }}"
          FULL: "${{ needs.changes.outputs.full }}"
          BUN: "${{ needs.changes.outputs.bun }}"
        run: |
          set -euo pipefail
          result() {
            jq -r --arg job "$1" '.[$job].result // "missing"' <<< "$NEEDS"
          }
          check_success() {
            local job="$1"
            local status
            status="$(result "$job")"
            if [ "$status" != "success" ]; then
              echo "gate failed: $job: $status"
              exit 1
            fi
          }
          check_conditional() {
            local job="$1"
            local should_run="$2"
            local status
            status="$(result "$job")"
            case "$should_run:$status" in
              true:success|false:success|false:skipped) ;;
              *)
                echo "gate failed: $job: $status (expected run=$should_run)"
                exit 1
                ;;
            esac
          }
          check_success changes
          check_success typecheck
          check_success lint
          check_success licence
          check_success provenance
          check_success graph
          check_conditional unit "$FULL"
          check_conditional golden "$FULL"
          check_conditional golden-bun "$BUN"
          echo "all required checks passed"
