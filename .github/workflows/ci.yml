name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# The runner image is pinned deliberately: `ubuntu-latest` starts migrating to
# Ubuntu 26 on 2026-10-19, and the golden/oracle checks are validated on 24.04.
# Moving to a new image should be its own deliberate change.
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `typecheck` starts with `tsc -b`, so subsequent checks reuse the built output.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit --prod
      - run: pnpm licence:test
      - run: pnpm licence
      - run: pnpm provenance:test
      - run: pnpm provenance
      - run: pnpm graph:test
      - run: pnpm graph
      - run: pnpm fixtures:fetch
      - run: pnpm fixtures:test
      - run: pnpm catalogue:check
      # Command metadata is checked after the TypeScript build; docs remain outside VM state.
      - run: pnpm command-docs:test
      - run: node tools/command-docs/check.mjs
      - run: pnpm no-skips:test
      - run: pnpm make-package:test
      - run: node tools/no-skips/run.mjs --verify-groups
      - run: pnpm mobile:proof:test
      - run: pnpm icons:test
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group:
          - core-formats
          - core-script
          - core-engine
          - core-battle
          - synth
          - plugin-tk2-compat
          - render-webgl2
          - runner-harness
          - runner-headless
          - runner-mobile
          - runner-web
          - script-tools
          - script-cli
          - lsp
          - script-spec
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      - run: pnpm fixtures:fetch
      - run: pnpm build
      # Every shard runs once with legacy fixtures present, under the no-skips guard
      # and with V8 coverage enabled. `gate` merges the shard LCOV files and checks
      # the repository-wide line and branch thresholds.
      - run: node tools/no-skips/run.mjs --group ${{ matrix.group }} --lcov coverage/lcov-${{ matrix.group }}.info
      - uses: actions/upload-artifact@v6
        with:
          name: lcov-${{ matrix.group }}
          path: coverage/lcov-${{ matrix.group }}.info
          if-no-files-found: error
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      - run: pnpm fixtures:fetch
      - run: pnpm fixtures:check
      - run: pnpm build
      - run: node packages/runner-headless/dist/cli.js golden
      # The closing suite boots every fetched sample game through the real engine and compares frames, hashes and
      # diagnostics with the committed regression baselines (ticket 4.28).
      - run: node packages/runner-headless/dist/cli.js closing
      # Independent-oracle drift checks (Pillow is a CI-only dev tool, HPND, never shipped).
      - run: python3 -m pip install Pillow
      - run: pnpm oracle:check
      # The corpus gate (epic 2 Done-when 1): `dump --check` re-runs the dump
      # over both sample games and compares its JSON report with the committed
      # `golden/legacy-corpus.json`. A parser or decoder that drifts fails there,
      # naming the file. Regenerating the expectation is deliberate
      # (`pnpm dump:record`), like a golden (G5).
      - run: node packages/runner-headless/dist/cli.js dump --check golden/legacy-corpus.json fixtures/legacy && node packages/runner-headless/dist/cli.js dump --check golden/spec-examples.json docs/spec/examples
  script-dogfood:
    runs-on: ubuntu-24.04
    needs: [checks]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: tkr script check
        run: node packages/script-cli/dist/cli.js script check stock docs/spec/examples/game --json > /tmp/check.json && diff -u packages/script-cli/baselines/check.json /tmp/check.json
      - name: tkr script fmt --check
        run: node packages/script-cli/dist/cli.js script fmt --check stock docs/spec/examples/game --json > /tmp/fmt.json && diff -u packages/script-cli/baselines/fmt.json /tmp/fmt.json
      - name: tkr script index
        run: node packages/script-cli/dist/cli.js script index stock docs/spec/examples/game --json > /tmp/index.json && diff -u packages/script-cli/baselines/index.json /tmp/index.json
      - name: tkr script docs
        run: node packages/script-cli/dist/cli.js script docs --json > /tmp/docs.json && diff -u packages/script-cli/baselines/docs.json /tmp/docs.json
      - name: tkr script test
        run: node packages/script-cli/dist/cli.js script test packages/script-cli/test/fixtures/pass-project --json > /tmp/test.json && diff -u packages/script-cli/baselines/test.json /tmp/test.json
  golden-bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      # `golden:bun` replays the golden and closing suites under Bun against the
      # committed output; the `golden` job already covers the Node replay.
      - run: pnpm fixtures:fetch
      - run: pnpm golden:bun
  # The desktop lane (entry 9.11): the Electron shell opens a package from disk over `app://` and reports the tick-120
  # hashes. Linux needs a virtual display; macOS and Windows runners have one. The job runs the same script on each, and
  # the artefact it uploads is the measurement record — the numbers are the runner's, never hand-written.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:fetch
      - run: pnpm build
      - run: pnpm make-package fixtures/legacy/demo --closing-plan golden/closing/plan.json --game demo --out fixtures/packages/demo.tpk --title Demo
      - run: pnpm desktop:build
      - name: Measure the desktop runner
        if: runner.os != 'Linux'
        run: pnpm desktop:measure --out tools/desktop/measurements/${{ runner.os }}.json
      - name: Measure the desktop runner under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm desktop:measure --out tools/desktop/measurements/${{ runner.os }}.json
      # Inventory must run after measurement so the Electron binary has been downloaded and extracted.
      - run: pnpm desktop:inventory
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-measurement-${{ runner.os }}
          path: tools/desktop/measurements/${{ runner.os }}.json
          if-no-files-found: error
  # The browser lane (ADR 0015, D-9): one headless Chromium project. Playwright and its browser binaries are dev-only,
  # never shipped; the lane boots a sample game to the committed tick-120 hashes and replays the raster vectors.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm fixtures:fetch
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm browser:test
  # The mobile lane builds and drives the real Capacitor APK on API 33. The
  # proof script captures the page's own readings and fails instead of
  # substituting browser stubs or synthetic reports.
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-33" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - run: mkdir -p artifacts/mobile-proof
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm fixtures:fetch
      - run: pnpm make-package fixtures/legacy/demo --closing-plan golden/closing/plan.json --game demo --out fixtures/packages/demo.tpk --title Demo
      - run: pnpm mobile:build
      - name: Add Android platform
        run: cd packages/runner-mobile && npx cap add android
      - name: Sync Capacitor Android project
        run: cd packages/runner-mobile && npx cap sync android
      - name: Assemble debug APK
        run: cd packages/runner-mobile/android && ./gradlew assembleDebug
      - name: Configure and require KVM access
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is unavailable on this runner"
            exit 1
          fi
          getent group kvm >/dev/null || sudo groupadd --system kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm-access.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is not readable and writable by the runner"
            exit 1
          fi
          stat -c '%A %U:%G %n' /dev/kvm
      - name: Exercise APK on API 33 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: "true"
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: pnpm mobile:proof
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-android-api33-proof
          path: artifacts/mobile-proof/
          if-no-files-found: error
  gate:
    needs: [checks, unit, golden, golden-bun, browser, desktop, mobile, script-dogfood]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
          NEEDS: "${{ toJSON(needs) }}"
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"'
          [ -n "$RESULTS" ] || { echo "no results"; exit 1; }
          for r in $RESULTS; do [ "$r" = success ] || { echo "gate failed: $NEEDS"; exit 1; }; done
          echo "all required jobs succeeded: $RESULTS"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          path: coverage/shards
          merge-multiple: true
      - run: node tools/no-skips/run.mjs --merge-lcov coverage/lcov.info coverage/shards/lcov-*.info
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: node-test-coverage
          path: coverage/lcov.info
          if-no-files-found: error
