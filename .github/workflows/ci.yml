name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# The runner image is pinned deliberately: `ubuntu-latest` starts migrating to
# Ubuntu 26 on 2026-10-19, and the golden/oracle checks are validated on 24.04.
# Moving to a new image should be its own deliberate change.
jobs:
  # The change classifier (ADR 0016, issue #664). It publishes a verdict and never skips a job. The jobs
  # marked "classified" below always run and always report: each prints this verdict first and defers its own
  # steps only when `changes` succeeded and `full` is 'false', which the classifier says only when every changed
  # path is on the inert list. An unknown event, an empty or unparseable diff, a missing verdict or a classifier
  # failure all select a full run, and a classifier failure also fails this job, which fails `gate`.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.classify.outputs.full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      # Full history, so the base commit is available to diff against. Nothing from the PR head may execute
      # before `classify` seals its verdict.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -u
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ci-classify.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          out="$work/classifier-output"
          paths="$work/changed-paths"
          classifier="$work/classify-changes.mjs"
          : > "$out"
          # A stated verdict that selects a full run.
          verdict_full() {
            printf 'full=true\nreason=full: %s\n' "$1" >> "$GITHUB_OUTPUT"
            echo "verdict: RUN - full: $1"
            exit 0
          }
          # The classifier could not produce a verdict: select a full run and fail this job.
          failure() {
            printf 'full=true\nreason=full: classifier failure: %s\n' "$1" >> "$GITHUB_OUTPUT"
            echo "::error title=CI classifier failure::$1; selecting a full run and failing the changes job"
            exit 1
          }
          if [ "$EVENT_NAME" != pull_request ]; then
            # Not a pull request (a push to main): never execute anything from the checkout; always run in full.
            case "$EVENT_NAME" in
              *[!A-Za-z0-9_.-]*|"") verdict_full "event is not pull_request" ;;
              *) verdict_full "event \"$EVENT_NAME\" is not pull_request" ;;
            esac
          fi
          case "$BASE_SHA" in ""|*[!0-9a-fA-F]*) failure "invalid base commit SHA" ;; esac
          case "$HEAD_SHA" in ""|*[!0-9a-fA-F]*) failure "invalid head commit SHA" ;; esac
          git --no-replace-objects cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || failure "base commit is not available"
          git --no-replace-objects cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || failure "head commit is not available"
          # Read the base branch's classifier with replacement objects disabled, so a pull request cannot
          # rewrite history or loosen the rules that judge it.
          base_kind="$(git --no-replace-objects cat-file -t "${BASE_SHA}:tools/ci/classify-changes.mjs" 2>/dev/null || true)"
          if [ -z "$base_kind" ]; then
            verdict_full "the base commit has no tools/ci/classify-changes.mjs yet"
          fi
          [ "$base_kind" = blob ] || failure "base classifier is not a blob"
          git --no-replace-objects show --no-textconv "${BASE_SHA}:tools/ci/classify-changes.mjs" > "$classifier" || failure "cannot read the base classifier"
          # --no-renames: a rename contributes both its old and its new path. -z: paths are NUL-delimited.
          git --no-replace-objects diff --no-ext-diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" -- > "$paths" || failure "the changed-path list could not be computed"
          (
            cd "$work" &&
              GITHUB_OUTPUT="$out" GITHUB_EVENT_NAME="$EVENT_NAME" node "$classifier" < "$paths"
          ) || failure "the classifier did not produce a verdict"
          # Accept only a complete, consistent verdict; a defer must carry its inert-paths evidence.
          [ "$(wc -l < "$out")" -eq 2 ] || failure "the classifier output was incomplete"
          case "$(sed -n 1p "$out")|$(sed -n 2p "$out")" in
            "full=true|reason=full: "* | "full=false|reason=inert: "*) ;;
            *) failure "the classifier output was inconsistent" ;;
          esac
          cat "$out" >> "$GITHUB_OUTPUT"
      # The pull request's own unit tests run after `classify` has sealed its verdict and deleted `$work`.
      # If this step fails, `changes` fails, downstream jobs ignore any `defer` verdict, and `gate` fails.
      - name: Test the classifier
        if: ${{ !cancelled() }}
        run: node --test tools/ci/test/classify-changes.test.mjs
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `typecheck` starts with `tsc -b`, so subsequent checks reuse the built output.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit --prod
      - run: pnpm licence:test
      - run: pnpm licence
      - run: pnpm provenance:test
      - run: pnpm provenance
      - run: pnpm graph:test
      - run: pnpm graph
      - run: pnpm fixtures:fetch
      - run: pnpm corpus:measure --check
      - run: pnpm fixtures:test
      - run: pnpm catalogue:check
      # Command metadata is checked after the TypeScript build; docs remain outside VM state.
      - run: pnpm command-docs:test
      - run: node tools/command-docs/check.mjs
      - run: pnpm no-skips:test
      - run: pnpm make-package:test
      - run: node tools/no-skips/run.mjs --verify-groups
      - run: pnpm mobile:proof:test
      - run: pnpm icons:test
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group:
          - core-formats
          - core-script
          - core-engine
          - core-battle
          - synth
          - plugin-tk2-compat
          - render-webgl2
          - runner-harness
          - runner-headless
          - runner-mobile
          - runner-web
          - script-tools
          - script-cli
          - lsp
          - script-spec
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      - run: pnpm fixtures:fetch
      - run: pnpm build
      # Every shard runs once with legacy fixtures present, under the no-skips guard
      # and with V8 coverage enabled. `gate` merges the shard LCOV files and checks
      # the repository-wide line and branch thresholds.
      - run: node tools/no-skips/run.mjs --group ${{ matrix.group }} --lcov coverage/lcov-${{ matrix.group }}.info
      - uses: actions/upload-artifact@v6
        with:
          name: lcov-${{ matrix.group }}
          path: coverage/lcov-${{ matrix.group }}.info
          if-no-files-found: error
  # Classified (ADR 0016): always runs and prints the classifier's verdict; defers its steps only for an inert change.
  golden:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: CI classifier decision
        shell: bash
        env:
          JOB: golden
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "$CHANGES" = success ] && [ "$FULL" = false ]; then
            echo "CI classifier [$JOB]: DEFER - nothing this job guards could have changed; $REASON"
          elif [ "$CHANGES" != success ]; then
            echo "CI classifier [$JOB]: RUN - changes job result was '$CHANGES' (${REASON:-no classifier verdict})"
          else
            echo "CI classifier [$JOB]: RUN - ${REASON:-full: no classifier verdict, treated as full}"
          fi
      - uses: actions/checkout@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/cache@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      - run: pnpm fixtures:fetch
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm fixtures:check
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm build
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: node packages/runner-headless/dist/cli.js golden
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      # The closing suite boots every fetched sample game through the real engine and compares frames, hashes and
      # diagnostics with the committed regression baselines (ticket 4.28).
      - run: node packages/runner-headless/dist/cli.js closing
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      # Independent-oracle drift checks (Pillow is a CI-only dev tool, HPND, never shipped).
      - run: python3 -m pip install Pillow
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm oracle:check
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      # The corpus gate (epic 2 Done-when 1): `dump --check` re-runs the dump
      # over both sample games and compares its JSON report with the committed
      # `golden/legacy-corpus.json`. A parser or decoder that drifts fails there,
      # naming the file. Regenerating the expectation is deliberate
      # (`pnpm dump:record`), like a golden (G5).
      - run: node packages/runner-headless/dist/cli.js dump --check golden/legacy-corpus.json fixtures/legacy && node packages/runner-headless/dist/cli.js dump --check golden/spec-examples.json docs/spec/examples
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
  # Classified (ADR 0016): runs independently of `checks`, so a `checks` failure never skips it.
  script-dogfood:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: CI classifier decision
        shell: bash
        env:
          JOB: script-dogfood
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "$CHANGES" = success ] && [ "$FULL" = false ]; then
            echo "CI classifier [$JOB]: DEFER - nothing this job guards could have changed; $REASON"
          elif [ "$CHANGES" != success ]; then
            echo "CI classifier [$JOB]: RUN - changes job result was '$CHANGES' (${REASON:-no classifier verdict})"
          else
            echo "CI classifier [$JOB]: RUN - ${REASON:-full: no classifier verdict, treated as full}"
          fi
      - uses: actions/checkout@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm build
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - name: tkr script check
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: node packages/script-cli/dist/cli.js script check stock docs/spec/examples/game --json > /tmp/check.json && diff -u packages/script-cli/baselines/check.json /tmp/check.json
      - name: tkr script fmt --check
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: node packages/script-cli/dist/cli.js script fmt --check stock docs/spec/examples/game --json > /tmp/fmt.json && diff -u packages/script-cli/baselines/fmt.json /tmp/fmt.json
      - name: tkr script index
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: node packages/script-cli/dist/cli.js script index stock docs/spec/examples/game --json > /tmp/index.json && diff -u packages/script-cli/baselines/index.json /tmp/index.json
      - name: tkr script docs
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: node packages/script-cli/dist/cli.js script docs --json > /tmp/docs.json && diff -u packages/script-cli/baselines/docs.json /tmp/docs.json
      - name: tkr script test
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: node packages/script-cli/dist/cli.js script test packages/script-cli/test/fixtures/pass-project --json > /tmp/test.json && diff -u packages/script-cli/baselines/test.json /tmp/test.json
  # Classified (ADR 0016).
  golden-bun:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: CI classifier decision
        shell: bash
        env:
          JOB: golden-bun
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "$CHANGES" = success ] && [ "$FULL" = false ]; then
            echo "CI classifier [$JOB]: DEFER - nothing this job guards could have changed; $REASON"
          elif [ "$CHANGES" != success ]; then
            echo "CI classifier [$JOB]: RUN - changes job result was '$CHANGES' (${REASON:-no classifier verdict})"
          else
            echo "CI classifier [$JOB]: RUN - ${REASON:-full: no classifier verdict, treated as full}"
          fi
      - uses: actions/checkout@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/cache@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          path: fixtures/legacy
          key: legacy-games-${{ hashFiles('tools/fixtures/sources.json') }}
      # `golden:bun` replays the golden and closing suites under Bun against the
      # committed output; the `golden` job already covers the Node replay.
      - run: pnpm fixtures:fetch
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm golden:bun
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
  # The desktop lane (entry 9.11): the Electron shell opens a package from disk over `app://` and reports the tick-120
  # hashes. Linux needs a virtual display; macOS and Windows runners have one. The job runs the same script on each, and
  # the artefact it uploads is the measurement record — the numbers are the runner's, never hand-written.
  desktop:
    needs: [changes]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: CI classifier decision
        shell: bash
        env:
          JOB: desktop (${{ matrix.os }})
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "$CHANGES" = success ] && [ "$FULL" = false ]; then
            echo "CI classifier [$JOB]: DEFER - nothing this job guards could have changed; $REASON"
          elif [ "$CHANGES" != success ]; then
            echo "CI classifier [$JOB]: RUN - changes job result was '$CHANGES' (${REASON:-no classifier verdict})"
          else
            echo "CI classifier [$JOB]: RUN - ${REASON:-full: no classifier verdict, treated as full}"
          fi
      - uses: actions/checkout@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm fixtures:fetch
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm build
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm make-package fixtures/legacy/demo --closing-plan golden/closing/plan.json --game demo --out fixtures/packages/demo.tpk --title Demo
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm desktop:build
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - name: Measure the desktop runner
        if: (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') && runner.os != 'Linux'
        run: pnpm desktop:measure --out tools/desktop/measurements/${{ runner.os }}.json
      - name: Measure the desktop runner under Xvfb
        if: (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') && runner.os == 'Linux'
        run: xvfb-run -a pnpm desktop:measure --out tools/desktop/measurements/${{ runner.os }}.json
      # Inventory must run after measurement so the Electron binary has been downloaded and extracted.
      - run: pnpm desktop:inventory
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/upload-artifact@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          name: desktop-measurement-${{ runner.os }}
          path: tools/desktop/measurements/${{ runner.os }}.json
          if-no-files-found: error
  # The browser lane (ADR 0015, D-9): one headless Chromium project. Playwright and its browser binaries are dev-only,
  # never shipped; the lane boots a sample game to the committed tick-120 hashes and replays the raster vectors.
  browser:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: CI classifier decision
        shell: bash
        env:
          JOB: browser
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "$CHANGES" = success ] && [ "$FULL" = false ]; then
            echo "CI classifier [$JOB]: DEFER - nothing this job guards could have changed; $REASON"
          elif [ "$CHANGES" != success ]; then
            echo "CI classifier [$JOB]: RUN - changes job result was '$CHANGES' (${REASON:-no classifier verdict})"
          else
            echo "CI classifier [$JOB]: RUN - ${REASON:-full: no classifier verdict, treated as full}"
          fi
      - uses: actions/checkout@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm build
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm fixtures:fetch
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm exec playwright install --with-deps chromium
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm browser:test
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
  # The mobile lane builds and drives the real Capacitor APK on API 33. The
  # proof script captures the page's own readings and fails instead of
  # substituting browser stubs or synthetic reports.
  mobile:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: CI classifier decision
        shell: bash
        env:
          JOB: mobile
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "$CHANGES" = success ] && [ "$FULL" = false ]; then
            echo "CI classifier [$JOB]: DEFER - nothing this job guards could have changed; $REASON"
          elif [ "$CHANGES" != success ]; then
            echo "CI classifier [$JOB]: RUN - changes job result was '$CHANGES' (${REASON:-no classifier verdict})"
          else
            echo "CI classifier [$JOB]: RUN - ${REASON:-full: no classifier verdict, treated as full}"
          fi
      - uses: actions/checkout@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: pnpm/action-setup@v6
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-java@v5
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-33" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: mkdir -p artifacts/mobile-proof
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm install --frozen-lockfile
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm build
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm fixtures:fetch
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm make-package fixtures/legacy/demo --closing-plan golden/closing/plan.json --game demo --out fixtures/packages/demo.tpk --title Demo
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - run: pnpm mobile:build
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - name: Add Android platform
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: cd packages/runner-mobile && npx cap add android
      - name: Sync Capacitor Android project
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: cd packages/runner-mobile && npx cap sync android
      - name: Assemble debug APK
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: cd packages/runner-mobile/android && ./gradlew assembleDebug
      - name: Configure and require KVM access
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is unavailable on this runner"
            exit 1
          fi
          getent group kvm >/dev/null || sudo groupadd --system kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm-access.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is not readable and writable by the runner"
            exit 1
          fi
          stat -c '%A %U:%G %n' /dev/kvm
      - name: Exercise APK on API 33 emulator
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: "true"
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: pnpm mobile:proof
      - name: Upload Android proof and failure diagnostics
        if: always() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false')
        with:
          name: mobile-android-api33-proof
          path: artifacts/mobile-proof/
          if-no-files-found: error
  gate:
    needs: [changes, checks, unit, golden, golden-bun, browser, desktop, mobile, script-dogfood]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history, so `gate` can recompute the diff for its own cross-check below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Required jobs and classifier verdict
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
          NEEDS: "${{ toJSON(needs) }}"
          FULL: ${{ needs.changes.outputs.full }}
          REASON: ${{ needs.changes.outputs.reason }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"'
          [ -n "$RESULTS" ] || { echo "no results"; exit 1; }
          for r in $RESULTS; do [ "$r" = success ] || { echo "gate failed: $NEEDS"; exit 1; }; done
          # The classifier (ADR 0016) must have produced a verdict, and a defer must carry its inert-paths evidence.
          case "$FULL" in
            true)
              case "$REASON" in
                "full: "*) ;;
                *) echo "gate failed: classifier ran without a full reason: $REASON"; exit 1 ;;
              esac ;;
            false)
              [ "$EVENT" = pull_request ] || { echo "gate failed: classifier deferred outside a pull request"; exit 1; }
              case "$REASON" in
                "inert: "*) ;;
                *) echo "gate failed: classifier deferred without an inert-paths reason: $REASON"; exit 1 ;;
              esac ;;
            *) echo "gate failed: classifier returned no verdict (full='$FULL')"; exit 1 ;;
          esac
          # Belt-and-braces, not a guarantee (ADR 0016): a workflow or classifier change must never be "inert".
          # This catches a stale classifier or an honest mistake; `gate`'s own steps are as head-controlled as any.
          if [ "$FULL" = false ]; then
            case "$BASE_SHA" in ""|*[!0-9a-fA-F]*) echo "gate failed: cannot verify the diff (base='$BASE_SHA')"; exit 1 ;; esac
            case "$HEAD_SHA" in ""|*[!0-9a-fA-F]*) echo "gate failed: cannot verify the diff (head='$HEAD_SHA')"; exit 1 ;; esac
            if ! git --no-replace-objects diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" -- > "$RUNNER_TEMP/gate-paths"; then
              echo "gate failed: cannot compute the changed paths"; exit 1
            fi
            if tr '\0' '\n' < "$RUNNER_TEMP/gate-paths" | grep -Eq '^(\.github/workflows/|tools/ci/)'; then
              echo "gate failed: a workflow or classifier change cannot be inert"
              tr '\0' '\n' < "$RUNNER_TEMP/gate-paths" | grep -E '^(\.github/workflows/|tools/ci/)'
              exit 1
            fi
          fi
          echo "all required jobs succeeded: $RESULTS (classifier: full=$FULL; $REASON)"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          path: coverage/shards
          merge-multiple: true
      - run: node tools/no-skips/run.mjs --merge-lcov coverage/lcov.info coverage/shards/lcov-*.info
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: node-test-coverage
          path: coverage/lcov.info
          if-no-files-found: error
